name: Lightning Made Glass — original 2.5D cinematic short
on:
  push:
    branches: [main]
    paths:
      - production/fulgurite/**
      - .github/workflows/fulgurite-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fulgurite-20261125
  cancel-in-progress: false
jobs:
  render-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      FULGURITE_OUTPUT: build/fulgurite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic audio and visual toolchain
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'Pillow>=10,<14' 'opencv-python-headless>=4.10,<5'
      - name: Render original 33 second 2.5D film with frame-locked stereo sound
        run: |
          set -euo pipefail
          python production/fulgurite/render.py
      - name: Confirm complete decoding, video and audio, and source QA
        run: |
          set -euo pipefail
          file=build/fulgurite/lightning-made-glass.mp4
          ffmpeg -hide_banner -v error -xerror -i "$file" -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/fulgurite')
          q=json.loads((root/'qa.json').read_text())
          p=q['probe']
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          a=next(s for s in p['streams'] if s['codec_type']=='audio')
          assert (v['width'],v['height'],v['avg_frame_rate'])==(1080,1920,'30/1')
          assert v['codec_name']=='h264' and a['codec_name']=='aac'
          assert int(v['nb_frames'])==990
          assert abs(float(p['format']['duration'])-33)<.07
          assert len(q['cues'])==12
          assert all(c['audioSample']==1600*c['frame'] for c in q['cues'])
          assert not p.get('chapters')
          assert set(p['format'].get('tags',{})) <= {'major_brand','minor_version','compatible_brands','encoder'}
          print('990 unique frames, H.264 + AAC, synced score, no optional metadata')
          PY
      - name: Publish and verify public GitHub Release direct MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=lightning-made-glass-20261125
          asset=build/fulgurite/lightning-made-glass.mp4
          name=lightning-made-glass.mp4
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Lightning Made Glass — Fulgurite (2.5D)" \
              --notes "Original 33s 1080x1920/30fps science short with original 2.5D materials, continuous motion, original 128 BPM stereo score and Foley tied to the frame clock. All imagery/audio procedurally generated; no stock assets. Lightning can fuse silica-rich sand into hollow glass tubes called fulgurites. Artist's visualization; not real footage or a physical-time simulation. Sources: https://home.nps.gov/articles/grsa-fulgurites.htm and https://www.canada.ca/en/environment-climate-change/services/lightning/learn-more/fulgurites.html ." \
              --prerelease --latest=false
          fi
          curl -fsSL --retry 4 --retry-all-errors --max-time 240 "$url" -o "$RUNNER_TEMP/public-fulgurite.mp4"
          cmp "$asset" "$RUNNER_TEMP/public-fulgurite.mp4"
          sha256sum "$asset"
          echo "Verified direct MP4: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh repository video history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_video_history.py