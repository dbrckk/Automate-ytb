name: Validate production pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR animation work should not keep multiple superseded 400-test suites
# running concurrently; main-branch delivery checks remain non-cancellable.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded FFmpeg, speech and project dependencies
        run: |
          set -euo pipefail
          # Ubuntu hosted runners often already ship FFmpeg, espeak and
          # DejaVu. Avoid unconditional apt update: it has hung until the
          # 20-minute job timeout in multiple unrelated PR checks.
          if ! command -v ffmpeg >/dev/null || ! command -v espeak-ng >/dev/null || ! fc-match DejaVuSans >/dev/null; then
            if ! sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core; then
              sudo timeout -k 10s 120s apt-get update -qq
              sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
            fi
          fi
          python -m pip install --disable-pip-version-check -e '.[motion]'
          ffmpeg -version | head -n 1
          espeak-ng --version
      - name: Unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Generate sourced example video
        run: |
          python -m automate_ytb create \
            --brief examples/facts.json \
            --duration 35 \
            --style documentary \
            --output outputs
      - name: Verify actual MP4/audio and deliverables
        run: python scripts/check_output.py outputs
      - name: Archive example deliverables
        uses: actions/upload-artifact@v4
        with:
          name: automate-ytb-ci-preview
          path: outputs/
          retention-days: 7
