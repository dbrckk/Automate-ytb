name: Validate production pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR animation work should not keep multiple superseded 400-test suites
# running concurrently; main-branch delivery checks remain non-cancellable.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded FFmpeg, speech and project dependencies
        run: |
          set -euo pipefail
          # Ubuntu hosted runners often already ship FFmpeg, espeak and
          # DejaVu. Avoid unconditional apt update: it has hung until the
          # 20-minute job timeout in multiple unrelated PR checks.
          # The production CLI supports either eSpeak NG or classic eSpeak.
          # Avoid calling apt on runners which already have working speech.
          if ! command -v ffmpeg >/dev/null || { ! command -v espeak-ng >/dev/null && ! command -v espeak >/dev/null; } || ! fc-match DejaVuSans >/dev/null; then
            if ! sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core; then
              sudo timeout -k 10s 120s apt-get update -qq
              sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
            fi
          fi
          python -m pip install --disable-pip-version-check -e '.[motion]'
          ffmpeg -version | head -n 1
          if command -v espeak-ng >/dev/null; then espeak-ng --version; else espeak --version; fi
      - name: Unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Generate sourced example video
        run: |
          python -m automate_ytb create \
            --brief examples/facts.json \
            --duration 35 \
            --style documentary \
            --output outputs
      - name: Verify actual MP4/audio and deliverables
        run: python scripts/check_output.py outputs
      # The real media checks above are release-blocking. A transient or
      # quota-related GitHub artifact upload failure must not falsely mark
      # passing unit, render, and encoded-MP4 checks as test failures.
      # Actual publication/release workflows keep their own strict gate.
      - name: Archive example deliverables (supplementary CI evidence)
        id: archive_preview
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: automate-ytb-ci-preview
          path: outputs/
          if-no-files-found: error
          retention-days: 7
      - name: Report optional artifact availability
        if: always()
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive_preview.outcome }}
        run: |
          if [ "$ARCHIVE_OUTCOME" != "success" ]; then
            echo "::warning::Supplemental CI artifact upload failed. The real video, audio, and tests were validated separately; publication delivery is NOT approved by this job."
          fi
