name: Verify true audiovisual baseline metrics (lot 0)

on:
  pull_request:
    paths:
      - "scripts/benchmark_audiovisual.py"
      - "tests/test_av_reference_baseline.py"
      - "docs/av-reference-baseline-2026-11-11.json"
      - ".github/workflows/av-reference-baseline.yml"
      - ".github/workflows/one-click-preview.yml"
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_audiovisual.py"
      - "tests/test_av_reference_baseline.py"
      - ".github/workflows/av-reference-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-reference-baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark-real-encoded-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install missing FFmpeg and FFprobe using bounded free system packages
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout -k 10s 120s apt-get update -qq
            sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Validate private-safe AV metrics against real encoded synthetic MP4
        run: |
          python -m py_compile scripts/benchmark_audiovisual.py tests/test_av_reference_baseline.py
          python -m unittest discover -s tests -p test_av_reference_baseline.py -v
      - name: Validate baseline documentation without shipping reference media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("docs/av-reference-baseline-2026-11-11.json").read_text(encoding="utf-8"))
          assert baseline["automatedArtisticJudgment"] is False
          assert baseline["humanAudioReviewCompleted"] is False
          assert len(baseline["videos"])==2
          assert all("sourcePath" not in v and "frames" not in v for v in baseline["videos"])
          assert not Path("3561.mp4").exists()
          assert not Path("ocean-heat-engine.mp4").exists()
          print("LOT0_AV_BASELINE_OK")
          PY
