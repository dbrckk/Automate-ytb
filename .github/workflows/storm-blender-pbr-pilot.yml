name: "Archived: Prove original PBR 3D storm rendering with free Blender CPU"

# Legacy P5.3 research only. Product policy is exclusively 2.5D.
# Archive the 3D CI trigger instead of rerunning rejected Blender videos
# whenever common science or video code changes. Source/history retained.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-2point5d-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain 2.5D-only video pipeline policy
        run: |
          echo "### Archived Blender experiment" >> "$GITHUB_STEP_SUMMARY"
          echo "Current production generates only original 2.5D video." >> "$GITHUB_STEP_SUMMARY"
          echo "No 3D render, paid credits or social publishing executed." >> "$GITHUB_STEP_SUMMARY"
