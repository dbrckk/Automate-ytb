name: Saturn has six corners — render and verify MP4
on:
  push:
    branches: [main]
    paths:
      - production/saturn-six-corners/render.py
      - .github/workflows/saturn-six-corners-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saturn-six-corners-video-release
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the CPU renderer and neural TTS
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<14' 'opencv-python-headless>=4.10,<5' 'kokoro-onnx==0.6.1'
      - name: Render Cassini montage, narration, captions and sound design
        run: python production/saturn-six-corners/render.py
      - name: Verify the full MP4 and its metadata
        run: |
          set -euo pipefail
          root=build/saturn-corners
          file="$root/saturn-six-corners.mp4"
          python -m automate_ytb.shorts_delivery --video "$file" --require-audio --full-decode --report "$root/qa.json"
          ffprobe -v error -show_format -show_streams -show_chapters -of json "$file" > "$root/probe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/saturn-corners')
          qa=json.loads((root/'qa.json').read_text())
          p=json.loads((root/'probe.json').read_text())
          assert qa['status']=='passed' and qa['fullDecodeVerified']
          assert (qa['media']['width'],qa['media']['height'],qa['media']['fps'])==(1080,1920,30)
          assert 22 < qa['media']['durationSeconds'] < 50 and not p.get('chapters')
          tags=p['format'].get('tags',{})
          assert set(tags) <= {'major_brand','minor_version','compatible_brands'}, tags
          for stream in p['streams']:
              tags=stream.get('tags',{})
              assert set(tags) <= {'language','handler_name','vendor_id'}, tags
          print('1080×1920, 30 fps, full video/audio decode, no optional export tags or chapters.')
          PY
      - name: Publish and verify anonymous direct MP4 download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="build/saturn-corners"
          tag=saturn-six-corners-20261121
          name=saturn-six-corners.mp4
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/saturn-release.md" <<'NOTES'
          A portrait science short with Cassini imagery, original animation, English narration and an original mix.

          Cassini source imagery: NASA/JPL-Caltech/SSI (PIA14944, PIA14945, PIA11141) and NASA/JPL-Caltech/SSI/Hampton University (PIA17652). Earth image: Apollo 17, NASA Johnson Space Center, AS17-148-22727. Narration is neural TTS.

          Research: https://science.nasa.gov/photojournal/in-full-view-saturns-streaming-hexagon/ and https://ntrs.nasa.gov/citations/19900038408 .
          NOTES
            gh release create "$tag" "$root/$name" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Saturn Has Six Corners" --notes-file "$RUNNER_TEMP/saturn-release.md" --prerelease --latest=false
          fi
          curl -fsSL --retry 4 --retry-all-errors --max-time 180 "$url" -o "$RUNNER_TEMP/saturn-public.mp4"
          cmp "$root/$name" "$RUNNER_TEMP/saturn-public.mp4"
          sha256sum "$root/$name"
          echo "Verified direct MP4: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh video catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_video_history.py
