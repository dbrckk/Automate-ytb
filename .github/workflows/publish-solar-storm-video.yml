name: Publish Solar Storm video as a direct MP4 link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-solar-storm-video.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the already validated solar storm video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41236660065 --repo "$GITHUB_REPOSITORY" \
            --name solar-storm-english-short --dir "$RUNNER_TEMP/solar"
          test -s "$RUNNER_TEMP/solar/final/Solar_Storm_Short_EN_1080x1920.mp4"
          test -s "$RUNNER_TEMP/solar/final/qa.json"
          python3 - "$RUNNER_TEMP/solar/final/qa.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1],encoding='utf-8'))
          assert q["status"]=="passed", q
          assert q["shot_count"]>=10, q
          print("Validated original QA:",q["shot_count"],"shots")
          PY
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/solar/final/Solar_Storm_Short_EN_1080x1920.mp4"
          sha256sum "$RUNNER_TEMP/solar/final/Solar_Storm_Short_EN_1080x1920.mp4"

      - name: Publish one permanent direct-download GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/solar/final/Solar_Storm_Short_EN_1080x1920.mp4"
          TAG="solar-storm-en-2026-10-31"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; replace verified asset"
            gh release upload "$TAG" "$ASSET#Solar_Storm_EN_1080x1920.mp4" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "$ASSET#Solar_Storm_EN_1080x1920.mp4" \
              "$RUNNER_TEMP/solar/final/subtitles_en.srt#Solar_Storm_EN.srt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Solar Storm — English 1080x1920 MP4" \
              --notes "35-second English NASA space-weather short. Direct downloadable video asset, not a temporary ChatGPT Library link. NASA SDO observations, separate NASA science visualizations, and original generated narration. See repository for credits." \
              --latest=false
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Solar_Storm_EN_1080x1920.mp4"
          echo "DIRECT_VIDEO_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | [.name, .size, .url] | @tsv'
