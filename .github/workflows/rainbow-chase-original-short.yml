name: Produce original rainbow-chase science Short

# New original episode, not the previously released how-rainbows-form video.
# Preview-only: stable GitHub Release delivery is independent and QA-gated.
on:
  pull_request:
    paths:
      - ".github/workflows/rainbow-chase-original-short.yml"
      - "tests/test_rainbow_chase_original_episode.py"
      - "automate_ytb/science_rainbow.py"
      - "automate_ytb/science_portrait.py"
      - "automate_ytb/causal_action25d.py"
      - "automate_ytb/science_audio_cues.py"
      - "tests/test_causal_observer25d.py"
      - "docs/EPISODE_RAINBOW_CHASE_2026-11-10.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rainbow-chase-original-short.yml"
      - "automate_ytb/science_rainbow.py"
      - "automate_ytb/science_portrait.py"
      - "automate_ytb/causal_action25d.py"
      - "automate_ytb/science_audio_cues.py"
      - "tests/test_causal_observer25d.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rainbow-chase-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify unique authored five-beat optics and downloadable release registry
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original free Pillow rendering engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate original rainbow optical script and video delivery safety
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_rainbow_chase_original_episode.py -v
          python -m unittest discover -s tests -p test_science_rainbow.py -v
          python -m unittest discover -s tests -p test_causal_observer25d.py -v
          python -m unittest discover -s tests -p test_preview_delivery.py -v

  render-and-verify:
    needs: preflight
    if: github.event_name != 'pull_request'
    name: Render original 33s 1080x1920 30fps English Kokoro H264/AAC film
    uses: ./.github/workflows/one-click-preview.yml
    with:
      topic: "Why Can't You Reach the End of a Rainbow?"
      original_script: >-
        White sunlight reaches falling raindrops, carrying many colors even though the beam looks perfectly white.
        Entering a raindrop, each color refracts and bends by a slightly different angle inside water.
        Some light reflects from the curved inside back surface, turning toward the front of the drop.
        Leaving the drop, the colors bend again, sending selected rays toward your eyes at precise viewing angles.
        Millions of droplets create the rainbow each observer sees; when you move, its apparent end moves too.
      character: "Original sun, layered rain clouds, optically refractive droplets, colored light rays and mobile observer"
      style: science
      language: en
      voice: kokoro
      voice_name: af_heart
      voice_style: natural
      soundtrack: ambient
      transition: adaptive
      caption_timing: audio
      duration_seconds: 33
      shot_seconds: 6.6
      resolution: shorts
      render_profile: high

  confirm:
    name: Confirm real narrated native-9:16 video and subtitles passed QA
    needs: render-and-verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve strict editorial approval boundary
        run: |
          {
            echo '### Original rainbow-chase science Short technically passed'
            echo 'Native 1080x1920 30fps H264/AAC, Kokoro English af_heart,'
            echo 'audio-timed subtitles, moving original 2.5D optical materials.'
            echo 'Permanent MP4 release and video-history entry are made separately'
            echo 'only by the trusted science-preview-download workflow on main.'
            echo 'Human scientific/editorial review and pronunciation approval'
            echo 'have NOT happened. No TikTok/YouTube publishing performed.'
          } >> "$GITHUB_STEP_SUMMARY"
