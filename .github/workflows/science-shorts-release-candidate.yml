name: Verify full 9:16 science Shorts release candidate

# Explicit releases only. The called job owns generation, MP4/audio quality,
# SRT/VTT, contact-sheet integrity, and the downloadable MP4 artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/science-shorts-release-candidate.yml
      - automate_ytb/science_portrait.py
      - automate_ytb/science_storyboards.py
      - automate_ytb/science_motion.py

# Rendering and QA must be part of THIS run. A fire-and-forget dispatch can
# report green despite a subsequent Kokoro, FFmpeg, or media-QA failure.
permissions:
  contents: read

concurrency:
  group: science-shorts-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-and-verify:
    name: Render and verify real 30s English Kokoro 1080x1920 MP4
    uses: ./.github/workflows/one-click-preview.yml
    with:
      topic: "Why Do Ocean Currents Move?"
      original_script: >-
        Sunlight heats tropical oceans more than polar waters, creating temperature contrasts.
        Global winds push surface waters, driving currents across the ocean between continents.
        Earth's rotation bends currents through the Coriolis effect, producing broad rotating gyres.
        Near the poles, cold salty water sinks, feeding deep circulation beneath the waves.
        Currents redistribute heat around Earth, influencing weather, climate, and marine life.
      character: "Original animated Earth and ocean science graphics"
      style: science
      language: en
      voice: kokoro
      voice_name: af_heart
      voice_style: natural
      soundtrack: ambient
      transition: dissolve
      caption_timing: audio
      duration_seconds: 30
      shot_seconds: 6
      resolution: shorts
      render_profile: high

  confirm:
    name: Confirm production QA passed and locate release artifact
    needs: render-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record success only after complete encoded-video checks
        run: |
          {
            echo '### Native science Shorts production release gate PASSED'
            echo 'The reusable production job completed real Kokoro narration,'
            echo '1080x1920 H.264 at 30 fps, SRT/VTT, soundtrack and visual QA.'
            echo 'Find **automate-ytb-free-preview** in THIS runs Artifacts.'
            echo '**Human editorial approval and voice listening are still required.**'
          } >> "$GITHUB_STEP_SUMMARY"
