name: Publish verified maglev QA preview to permanent GitHub Release

on:
  push:
    paths:
      - '.github/workflows/publish-maglev-review.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release-verified-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve successful immutable visual QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "43640507748"
          EXPECTED_SOURCE_SHA: "26112be212a1f445ed34476ded0925fc0cc4ef90"
        run: |
          set -euo pipefail
          outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          test "$outcome" = "success"
          test "$commit" = "$EXPECTED_SOURCE_SHA"
          mkdir -p build/review
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name maglev-2p5d-visual-review --dir build/review
          test -s build/review/maglev-visual-draft.mp4
          test -s build/review/contact-sheet.jpg
          test -s build/review/full-decoding-qa.json
          test -s build/review/maglev-visual-draft.json
          test -s build/review/maglev-visual-draft.narration.wav
      - name: Independently verify original video byte hash and decoding
        run: |
          set -euo pipefail
          cd build/review
          printf '%s  %s\n' \
            'e018e60e6c34a13494b2bcb0885d230865e77b406a6c972409f4c5a7eab46feb' \
            'maglev-visual-draft.mp4' | sha256sum --check --status
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path("full-decoding-qa.json").read_text())
          assert qa["status"]=="passed" and qa["fullDecodeVerified"] is True
          assert qa["media"]["width"]==720 and qa["media"]["height"]==1280
          assert qa["media"]["videoCodec"]=="h264" and qa["media"]["audioCodec"]=="aac"
          assert qa["media"]["sizeBytes"]==Path("maglev-visual-draft.mp4").stat().st_size
          report=json.loads(Path("maglev-visual-draft.json").read_text())
          assert qa["publicationApproved"] is False
          assert report["publicationApproved"] is False
          assert report["voiceEngine"]=="kokoro" and report["voiceName"]=="af_heart"
          assert report["voiceStyle"]=="expressive"
          assert report["proceduralVisualActions"]==[
              "gap","wheels","levitation","propulsion","airflow"]
          assert report["proceduralVisualChapterPalettes"]==[
              "copper","amber","violet","cobalt","rose"]
          import hashlib,wave
          source=Path("maglev-visual-draft.narration.wav")
          with wave.open(str(source)) as wav:
              assert wav.getframerate()==24000 and wav.getnchannels()==1
              assert wav.getsampwidth()==2 and wav.getnframes()>24000*15
          with source.open("rb") as source_file:
              digest=hashlib.file_digest(source_file,"sha256").hexdigest()
          assert digest==report["voiceEvidence"]["sha256"]
          print("Verified genuine 720x1280 MP4, five color chapters and real Kokoro PCM")
          PY
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg; then
              sudo timeout -k 10s 120s apt-get update -qq
              sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          ffmpeg -nostdin -v error -xerror -i maglev-visual-draft.mp4 -f null -
          mv maglev-visual-draft.mp4 maglev-premium-2p5d-kokoro-preview.mp4
          sha256sum maglev-premium-2p5d-kokoro-preview.mp4 \
                    maglev-visual-draft.narration.wav > SHA256SUMS.txt
      - name: Publish lasting direct MP4 download and test public access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="maglev-kokoro-five-palettes-20261114"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.assets[] | select(.name=="maglev-premium-2p5d-kokoro-preview.mp4") | .digest')"
            test "$digest" = "sha256:e018e60e6c34a13494b2bcb0885d230865e77b406a6c972409f4c5a7eab46feb"
          else
            gh release create "$tag" \
            build/review/maglev-premium-2p5d-kokoro-preview.mp4 \
            build/review/maglev-visual-draft.narration.wav \
            build/review/maglev-visual-draft.json \
            build/review/contact-sheet.jpg \
            build/review/full-decoding-qa.json \
            build/review/maglev-visual-draft.srt \
            build/review/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Maglev — Kokoro neural voice and five premium color chapters (720p)" \
            --notes "Original 720x1280 30 FPS, 52-second H264/AAC MP4 QA preview, generated with Kokoro af_heart expressive narration and five art-directed 2.5D chapter palettes from source PR #314 (now merged). The original WAV, SRT, SHA256, contact sheet and full decoder QA are included. Human listening and visual assessment are still required; not published to TikTok/YouTube." \
            --prerelease --latest=false
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/maglev-premium-2p5d-kokoro-preview.mp4"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 180 \
            "$url" --output "$RUNNER_TEMP/public-maglev-preview.mp4"
          test "$(sha256sum "$RUNNER_TEMP/public-maglev-preview.mp4" | cut -d' ' -f1)" = \
            'e018e60e6c34a13494b2bcb0885d230865e77b406a6c972409f4c5a7eab46feb'
          {
            echo "## Verified permanent direct MP4 download"
            echo
            echo "$url"
            echo
            echo "Anonymous full-body GET succeeded; SHA256 matched the original."
          } >> "$GITHUB_STEP_SUMMARY"
