name: Verify shared real subpixel 2.5D optics across video subjects

on:
  pull_request:
    paths:
      - ".github/workflows/shared-optical-motion-25d-review.yml"
      - "automate_ytb/optical_motion25d.py"
      - "automate_ytb/scene25d.py"
      - "automate_ytb/finish25d.py"
      - "tests/test_optical_motion25d.py"
      - "scripts/review_optical_motion25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/shared-optical-motion-25d-review.yml"
      - "automate_ytb/optical_motion25d.py"
      - "automate_ytb/scene25d.py"
      - "automate_ytb/finish25d.py"
      - "tests/test_optical_motion25d.py"
      - "scripts/review_optical_motion25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-world-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free original graphics engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Check engine and existing 2.5D graphics regressions
        run: |
          set -euo pipefail
          python -m py_compile automate_ytb/optical_motion25d.py automate_ytb/scene25d.py automate_ytb/finish25d.py scripts/review_optical_motion25d.py
          python -m unittest discover -s tests -p test_optical_motion25d.py -v
          python -m unittest discover -s tests -p test_finish25d_seamless.py -v
          python -m unittest discover -s tests -p test_scene25d.py -v
          python -m unittest discover -s tests -p test_lightfield25d.py -v
      - name: Produce real 1080x1920 source comparisons for three video topics
        run: |
          set -euo pipefail
          python scripts/review_optical_motion25d.py --out build/p523-optics
          test -s build/p523-optics/cross-topic-original-optical-motion-25d.jpg
          test -s build/p523-optics/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-p523-shared-spatial-optics-25d
          path: build/p523-optics/
          retention-days: 14
          if-no-files-found: error
