name: Verify open ocean 2.5D source world instead of slideshow panels

on:
  pull_request:
    paths:
      - ".github/workflows/ocean-world-volume-25d-review.yml"
      - "automate_ytb/world_volume25d.py"
      - "automate_ytb/science_ocean_depth.py"
      - "automate_ytb/science_storyboards.py"
      - "automate_ytb/density_plume25d.py"
      - "tests/test_density_plume25d.py"
      - "tests/test_world_volume25d.py"
      - "scripts/review_ocean_world_volume25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ocean-world-volume-25d-review.yml"
      - "automate_ytb/world_volume25d.py"
      - "automate_ytb/science_ocean_depth.py"
      - "automate_ytb/science_storyboards.py"
      - "automate_ytb/density_plume25d.py"
      - "tests/test_density_plume25d.py"
      - "tests/test_world_volume25d.py"
      - "scripts/review_ocean_world_volume25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ocean-open-world:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free original 2D/2.5D renderer
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify actual 9:16 atmospheric occlusion and source bounds
        run: |
          set -euo pipefail
          python -m py_compile automate_ytb/world_volume25d.py automate_ytb/density_plume25d.py automate_ytb/science_storyboards.py automate_ytb/science_ocean_depth.py scripts/review_ocean_world_volume25d.py
          python -m unittest discover -s tests -p test_world_volume25d.py -v
          python -m unittest discover -s tests -p test_density_plume25d.py -v
          python -m unittest discover -s tests -p test_science_ocean_depth.py -v
          python -m unittest discover -s tests -p test_science_storyboards.py -v
          python -m unittest discover -s tests -p test_ocean_atmosphere25d.py -v
      - name: Render original 1080x1920 ocean narrative frames for inspection
        run: |
          set -euo pipefail
          python scripts/review_ocean_world_volume25d.py --out build/p519-ocean
          test -s build/p519-ocean/ocean-without-slide-panels-25d.jpg
          test -s build/p519-ocean/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-p519-ocean-world-volume-25d
          path: build/p519-ocean/
          retention-days: 14
          if-no-files-found: error
