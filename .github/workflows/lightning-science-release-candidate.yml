name: Verify original lightning-storm science Shorts

# Independent science episode, never substitutes Earth-stop frames.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lightning-science-release-candidate.yml"
      - "automate_ytb/science_lightning.py"
      - "automate_ytb/science_portrait.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightning-science-release-candidate.yml"
      - "automate_ytb/science_lightning.py"
      - "automate_ytb/science_portrait.py"

permissions:
  contents: read

concurrency:
  group: original-lightning-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-and-verify:
    name: Original French lightning science with Kokoro and five actions
    uses: ./.github/workflows/one-click-preview.yml
    with:
      topic: "Comment se forment les éclairs ?"
      original_script: >-
        Dans un nuage d'orage, les collisions entre gouttes et cristaux de glace contribuent à séparer les charges électriques.
        Quand le champ électrique devient suffisamment fort, un canal ionisé progresse par étapes vers le sol.
        Près du sol, des décharges ascendantes peuvent rejoindre ce canal et ouvrir un trajet conducteur.
        Un courant très intense remonte alors le canal : c'est l'éclair lumineux que nous observons, parfois répété.
        L'air se réchauffe brutalement et se dilate, créant une onde sonore : le tonnerre, que nous entendons après le flash lumineux.
      character: "Original authored animated storm-cloud charges, stepped leader, upward streamer, return stroke and pressure wave, no globe or repeated planet footage"
      style: science
      language: fr
      voice: kokoro
      voice_name: ff_siwis
      voice_style: natural
      soundtrack: ambient
      transition: dissolve
      caption_timing: audio
      duration_seconds: 34
      shot_seconds: 6.8
      resolution: shorts
      render_profile: high

  confirm:
    name: Confirm original lightning MP4 and French narration
    needs: render-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          {
            echo '### ORIGINAL lightning-science episode — technical QA passed'
            echo 'Five distinct authored scenes: collisions and charge separation, descending leader, upward attachment, return stroke, thunder shockwave.'
            echo 'Native 1080x1920 H264 30fps; French Kokoro voice; music; audio-aligned subtitles.'
            echo 'Retrieve the playable MP4 from **automate-ytb-free-preview** in this run.'
            echo 'Scientific and editorial review, including timing of visible actions, remains necessary before YouTube release.'
          } >> "$GITHUB_STEP_SUMMARY"
