name: Verify original lightning-storm science Shorts

# Independent science episode, never substitutes Earth-stop frames.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lightning-science-release-candidate.yml"
      - "automate_ytb/science_lightning.py"
      - "automate_ytb/science_lightning_fx.py"
      - "automate_ytb/cinematic_stage.py"
      - "automate_ytb/science_portrait.py"
      - "tests/test_science_lightning.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightning-science-release-candidate.yml"
      - "automate_ytb/science_lightning.py"
      - "automate_ytb/science_lightning_fx.py"
      - "automate_ytb/cinematic_stage.py"
      - "automate_ytb/science_portrait.py"
      - "tests/test_science_lightning.py"

permissions:
  contents: read

concurrency:
  group: original-lightning-release-${{ github.ref }}
  # Superseded PR renders must not consume CPU or block the newest proof.
  # Successful main-branch publication runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render-and-verify:
    name: Original English lightning science with Kokoro and five actions
    uses: ./.github/workflows/one-click-preview.yml
    with:
      topic: "The Secret Life of a Lightning Bolt"
      original_script: >-
        Inside a thundercloud, colliding ice particles separate electrical charges, building an enormous hidden imbalance.
        When the electric field becomes strong enough, a branching stepped leader begins descending through the stormy air.
        From the ground, upward streamers reach toward the approaching channel until one of these streamers connects with the descending leader.
        That connection triggers a brilliant return stroke, surging along the channel and lighting the entire sky.
        The lightning channel heats nearby air so rapidly that a powerful sound wave spreads outward as thunder.
      character: "Original animated lightning storm with physical cloud charge separation, branching leader, rising streamer, bright return stroke, thunder shock wave, moving clouds and rain"
      style: science
      language: en
      voice: kokoro
      voice_name: af_heart
      voice_style: natural
      soundtrack: ambient
      transition: adaptive
      caption_timing: audio
      duration_seconds: 36
      shot_seconds: 7.2
      resolution: shorts
      render_profile: high

  confirm:
    name: Confirm original lightning MP4 and natural English narration
    needs: render-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          {
            echo '### ORIGINAL lightning-science episode — technical QA passed'
            echo 'Five distinct authored scenes: collisions and charge separation, descending leader, upward attachment, return stroke, thunder shockwave.'
            echo 'Native 1080x1920 H264 30fps; English Kokoro af_heart voice; music; audio-aligned subtitles.'
            echo 'Retrieve the playable MP4 from **automate-ytb-free-preview** in this run.'
            echo 'Scientific and editorial review, including timing of visible actions, remains necessary before YouTube release.'
          } >> "$GITHUB_STEP_SUMMARY"
