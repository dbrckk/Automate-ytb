name: Verify shared causal 2.5D material ribbons across three real video subjects

on:
  pull_request:
    paths:
      - ".github/workflows/material-ribbons-25d-review.yml"
      - "automate_ytb/material_ribbons25d.py"
      - "automate_ytb/science_rainbow.py"
      - "automate_ytb/science_ocean_depth.py"
      - "automate_ytb/science_volcano.py"
      - "automate_ytb/science_storyboards.py"
      - "automate_ytb/organic_environment25d.py"
      - "scripts/review_material_ribbons25d.py"
      - "tests/test_material_ribbons25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/material-ribbons-25d-review.yml"
      - "automate_ytb/material_ribbons25d.py"
      - "automate_ytb/science_rainbow.py"
      - "automate_ytb/science_ocean_depth.py"
      - "automate_ytb/science_volcano.py"
      - "automate_ytb/science_storyboards.py"
      - "automate_ytb/organic_environment25d.py"
      - "scripts/review_material_ribbons25d.py"
      - "tests/test_material_ribbons25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shared-material-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Pillow art engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate genuine shared motion and three existing domains
        run: |
          set -euo pipefail
          python -m py_compile automate_ytb/material_ribbons25d.py scripts/review_material_ribbons25d.py
          python -m unittest discover -s tests -p test_material_ribbons25d.py -v
          python -m unittest discover -s tests -p test_science_rainbow.py -v
          python -m unittest discover -s tests -p test_science_volcano.py -v
          python -m unittest discover -s tests -p test_science_ocean_depth.py -v
          python -m unittest discover -s tests -p test_science_storyboards.py -v
          python -m unittest discover -s tests -p test_organic_environment25d.py -v
      - name: Render genuine 1080x1920 production frames with the three shared materials
        run: |
          set -euo pipefail
          python scripts/review_material_ribbons25d.py --out build/p510-material-ribbons
          test -s build/p510-material-ribbons/material-ribbons-contact.jpg
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build/p510-material-ribbons")
          report=json.loads((root/"manifest.json").read_text())
          assert report["materialsVersion"].endswith("p510-v1")
          assert {(r["topic"],r["beat"]) for r in report["samples"]} == {
            ("rainbow","refraction"),("ocean","wind"),("volcano","lava")}
          for row in report["samples"]:
            path=root/row["frame"]
            assert hashlib.sha256(path.read_bytes()).hexdigest()==row["sha256"]
            assert (row["sourceWidth"],row["sourceHeight"])==(1080,1920)
          assert report["humanReviewRequired"] and not report["published"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-original-p510-25d-material-strokes-multitopic
          path: build/p510-material-ribbons/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve honest editorial status
        run: |
          echo "Three real 1080x1920 production frames share one 2.5D material engine." >> "$GITHUB_STEP_SUMMARY"
          echo "Optical rays remain straight; ocean flow follows authors' original curves; lava follows the current advancing terrain path." >> "$GITHUB_STEP_SUMMARY"
          echo "This is material + frame QA, not a completed narrated social video or a claim of extreme visual quality." >> "$GITHUB_STEP_SUMMARY"
