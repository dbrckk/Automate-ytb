name: Verify eroded stratovolcano 2.5D buttresses in real science Shorts

on:
  pull_request:
    paths:
      - ".github/workflows/volcanic-buttresses-25d-review.yml"
      - "automate_ytb/science_volcano_mesh.py"
      - "tests/test_volcanic_buttresses25d.py"
      - "scripts/review_volcanic_buttresses25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/volcanic-buttresses-25d-review.yml"
      - "automate_ytb/science_volcano_mesh.py"
      - "tests/test_volcanic_buttresses25d.py"
      - "scripts/review_volcanic_buttresses25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rock-buttresses:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open source original source-geometry engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test actual original rock geometry, scene clipping and cameras
        run: |
          set -euo pipefail
          python -m py_compile automate_ytb/science_volcano_mesh.py scripts/review_volcanic_buttresses25d.py
          python -m unittest discover -s tests -p test_volcanic_buttresses25d.py -v
          python -m unittest discover -s tests -p test_science_volcano_mesh.py -v
          python -m unittest discover -s tests -p test_rock_surface25d.py -v
          python -m unittest discover -s tests -p test_science_volcano_lighting.py -v
      - name: Render two real 1080x1920 source-geometry video frames
        run: |
          set -euo pipefail
          python scripts/review_volcanic_buttresses25d.py --out build/p521-terrain
          test -s build/p521-terrain/original-eroded-volcanic-rock-25d.jpg
          test -s build/p521-terrain/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-p521-erosion-buttresses-25d
          path: build/p521-terrain/
          retention-days: 14
          if-no-files-found: error
