name: Tsunami — original 2.5D motion and frame-locked sound
on:
  push:
    branches: [main]
    paths:
      - production/tsunami/render.py
      - .github/workflows/tsunami-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tsunami-20261124
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      AUTOMATE_YTB_OUT: build/tsunami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic animation stack
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'Pillow>=10,<14' 'opencv-python-headless>=4.10,<5'
      - name: Render 30s of animated ocean with eight synchronized sound cues
        run: python production/tsunami/render.py
      - name: Decode video and audio, inspect export and strip tags
        run: |
          set -euo pipefail
          file=build/tsunami/tsunami-the-invisible-wave.mp4
          ffmpeg -v error -i "$file" -f null -
          ffprobe -v error -show_format -show_streams -show_chapters -of json "$file" > build/tsunami/probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/tsunami/probe.json').read_text())
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          a=next(s for s in p['streams'] if s['codec_type']=='audio')
          assert (v['width'],v['height'],v['avg_frame_rate'])==(1080,1920,'30/1')
          assert v['codec_name']=='h264' and a['codec_name']=='aac'
          assert int(v['nb_frames'])==900
          assert abs(float(p['format']['duration'])-30)<.06
          assert not p.get('chapters')
          assert set(p['format'].get('tags',{})) <= {'major_brand','minor_version','compatible_brands','encoder'}
          for stream in p['streams']:
              assert set(stream.get('tags',{})) <= {'language','handler_name','vendor_id','encoder'}
          PY
      - name: Publish MP4 and verify direct anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=tsunami-the-invisible-wave-20261124
          asset=build/tsunami/tsunami-the-invisible-wave.mp4
          name=tsunami-the-invisible-wave.mp4
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"               --title "The Wave You Can't See — original 2.5D short"               --notes "A complete original 30-second vertical animation (1080×1920 @ 30 fps) showing tsunami shoaling, with eight visual-sound events placed on the same frame clock, an original stereo score and sound effects. All scene artwork is generated in code. The wave heights, coast and subsurface geology are illustrative and not to scale. Based on NOAA JetStream: https://www.noaa.gov/jetstream/tsunamis/tsunami-propagation"               --prerelease --latest=false
          fi
          curl -fsSL --retry 4 --retry-all-errors --max-time 180 "$url" -o "$RUNNER_TEMP/tsunami-public.mp4"
          cmp "$asset" "$RUNNER_TEMP/tsunami-public.mp4"
          sha256sum "$asset"
          echo "Verified: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh repository video history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_video_history.py
