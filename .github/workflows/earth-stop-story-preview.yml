name: Render narrated Earth-stop 9:16 animation (Kokoro, offline visuals)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/earth-stop-story-preview.yml"
      - "automate_ytb/science_earth_stop.py"
      - "automate_ytb/science_portrait.py"
      - "automate_ytb/earth_kinetic_fx.py"
      - "automate_ytb/review_board.py"
      - "scripts/render_earth_animation_preview.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/earth-stop-story-preview.yml"
      - "automate_ytb/science_earth_stop.py"
      - "automate_ytb/science_portrait.py"
      - "automate_ytb/earth_kinetic_fx.py"
      - "automate_ytb/review_board.py"
      - "scripts/render_earth_animation_preview.py"

permissions:
  contents: read

jobs:
  earth-stop-story:
    name: Narrated causal animation, native 1080x1920
    uses: ./.github/workflows/one-click-preview.yml
    with:
      topic: "What If Earth Suddenly Stopped Spinning?"
      original_script: >-
        What if Earth suddenly stopped spinning?
        At the equator, the ground moves east at roughly seventeen hundred kilometers per hour, and inertia would carry objects onward.
        The atmosphere would keep moving at first, sending enormous winds across continents.
        The oceans would keep moving too, producing devastating coastal waves and floods.
        Over longer timescales, losing Earth's equatorial bulge could redistribute ocean water toward the poles.
        Day and night would follow a radically different cycle, with long periods of sunlight and darkness.
        Astronauts and people on the ground would face huge risks, and these drawings are explanatory rather than a physical simulation.
      character: "Original explanatory moving Earth, buildings, oceans and astronaut"
      style: science
      language: en
      voice: kokoro
      voice_name: af_heart
      voice_style: natural
      soundtrack: ambient
      transition: dissolve
      caption_timing: audio
      duration_seconds: 42
      shot_seconds: 6
      resolution: shorts
      render_profile: high

  fast-visual-review:
    name: Encode seven 30fps original Earth animations and inspect real H264
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free offline visual renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -e .
      - name: Encode original causal animations and verify decoded movement
        run: python scripts/render_earth_animation_preview.py
      - name: Archive actual playable movie and visual quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: earth-stop-seven-animated-scene-preview
          path: outputs/earth-motion-visual-qa/
          if-no-files-found: error
          retention-days: 14
