name: Verify real 2.5D animal ground contact and flower encounter

on:
  pull_request:
    paths:
      - "automate_ytb/rig25d.py"
      - "automate_ytb/forest25d.py"
      - "automate_ytb/forest_character_art25d.py"
      - "automate_ytb/forest_organic_mesh25d.py"
      - "automate_ytb/forest_anatomical_limb25d.py"
      - "automate_ytb/forest_cinematic_world25d.py"
      - "automate_ytb/forest_cinematic_framing25d.py"
      - "automate_ytb/forest_contact25d.py"
      - "automate_ytb/forest_butterfly25d.py"
      - "automate_ytb/forest_story25d.py"
      - "automate_ytb/scene25d.py"
      - "automate_ytb/animated_forest.py"
      - "scripts/render_25d_character_pilot.py"
      - "tests/test_rig25d.py"
      - "tests/test_forest_contact25d.py"
      - "tests/test_forest_butterfly25d.py"
      - "tests/test_forest_story25d.py"
      - "tests/test_forest_cinematic_world25d.py"
      - "tests/test_forest_cinematic_framing25d.py"
      - "tests/test_forest_character_art25d.py"
      - "tests/test_forest_organic_mesh25d.py"
      - "tests/test_forest_anatomical_limb25d.py"
      - ".github/workflows/p3-25d-character-pilot.yml"
  push:
    branches: [main]
    paths:
      - "automate_ytb/rig25d.py"
      - "automate_ytb/forest25d.py"
      - "automate_ytb/forest_character_art25d.py"
      - "automate_ytb/forest_organic_mesh25d.py"
      - "automate_ytb/forest_anatomical_limb25d.py"
      - "automate_ytb/forest_cinematic_world25d.py"
      - "automate_ytb/forest_cinematic_framing25d.py"
      - "automate_ytb/forest_contact25d.py"
      - "automate_ytb/forest_butterfly25d.py"
      - "automate_ytb/forest_story25d.py"
      - "tests/test_forest_contact25d.py"
      - "tests/test_forest_butterfly25d.py"
      - "tests/test_forest_story25d.py"
      - "tests/test_forest_cinematic_world25d.py"
      - "tests/test_forest_cinematic_framing25d.py"
      - "tests/test_forest_character_art25d.py"
      - "tests/test_forest_organic_mesh25d.py"
      - "tests/test_forest_anatomical_limb25d.py"
      - "scripts/render_25d_character_pilot.py"
      - ".github/workflows/p3-25d-character-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-grounded-25d-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render-grounded-fox:
    name: Genuine two-bone IK, zero-sliding contacts and native vertical MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        animal: [fox, rabbit, cat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source Pillow and FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout -k 10s 180s apt-get update -qq
            sudo timeout -k 10s 180s apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check -e .
      - name: Verify two-bone IK, actual foot locks and alpha compositing
        run: |
          python -m unittest discover -s tests -p test_rig25d.py -v
          python -m unittest discover -s tests -p test_forest_contact25d.py -v
          python -m unittest discover -s tests -p test_forest_butterfly25d.py -v
          python -m unittest discover -s tests -p test_forest_story25d.py -v
          python -m unittest discover -s tests -p test_forest_cinematic_world25d.py -v
          python -m unittest discover -s tests -p test_forest_cinematic_framing25d.py -v
          python -m unittest discover -s tests -p test_forest_character_art25d.py -v
          python -m unittest discover -s tests -p test_forest_organic_mesh25d.py -v
          python -m unittest discover -s tests -p test_forest_anatomical_limb25d.py -v
          python -m unittest discover -s tests -p test_scene25d.py -v
      - name: Encode real 1080x1920 30fps animated paw-to-flower scene
        run: |
          python scripts/render_25d_character_pilot.py --interaction --story --animal "${{ matrix.animal }}" --output "out/p3-${{ matrix.animal }}-25d/${{ matrix.animal }}-flower-contact.mp4"
      - name: Independently inspect real MP4 and physical-contact proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          animal="${{ matrix.animal }}"
          qa=json.loads(Path(f"out/p3-{animal}-25d/pilot-qa.json").read_text())
          assert qa["animal"]==animal
          assert qa["interactionEnabled"] is True
          assert qa["groundedFlowerContact"]["source"].startswith("verified right-foot")
          assert qa["groundedFlowerContact"]["pawGroundY"]==1361.0
          assert "released-petals" in qa["layers"]
          assert "reactive-butterfly" in qa["layers"]
          assert all(layer in qa["layers"] for layer in
                     ("sunbeams","understory","living-light","filmic-grade"))
          assert qa["artDirection"]["version"].startswith("original-forest-cinematic")
          assert qa["artDirection"]["physicalOpticalCuts"] is True
          assert qa["characterMaterials"]["version"].startswith("original-p37")
          assert qa["characterMaterials"]["exactIKWorldContact"] is True
          assert qa["characterMaterials"]["animatedScarfTip"] is True
          assert qa["organicSoftBody"]["version"].startswith("original-p38")
          assert qa["organicSoftBody"]["actualIKPawPositionsWarped"] is False
          assert qa["organicSoftBody"]["postContactDampedRecoil"] is True
          assert qa["anatomicalLimbs"]["version"].startswith("original-p39")
          assert qa["anatomicalLimbs"]["originalIKUnchanged"] is True
          assert qa["causalButterfly"]["trigger"]=="rig-verified paw impact"
          assert len(qa["eventDirectedStory"]["beats"])==4
          assert qa["eventDirectedStory"]["narration"].startswith("not generated")
          assert qa["causalButterfly"]["flightPhases"]==["approach","hover","retreat"]
          assert qa["status"]=="passed"
          assert qa["fps"]==30 and qa["size"]==[1080,1920]
          assert qa["maximumPlantedFootWorldDriftPx"]<=.001
          assert qa["maximumBoneLengthErrorPx"]<=.001
          assert qa["frames"]>=200
          assert not qa["publicationApproved"]
          print("P3_GROUNDED_25D_VIDEO_AND_IK_QA_PASS", qa["videoSha256"])
          PY
      - name: Preserve reviewable motion video, keyframes and measurements
        uses: actions/upload-artifact@v4
        with:
          name: automate-ytb-p3-25d-flower-contact-${{ matrix.animal }}
          path: |
            out/p3-${{ matrix.animal }}-25d/${{ matrix.animal }}-flower-contact.mp4
            out/p3-${{ matrix.animal }}-25d/pilot-qa.json
            out/p3-${{ matrix.animal }}-25d/frame-*.jpg
          if-no-files-found: error
          retention-days: 7
