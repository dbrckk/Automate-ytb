name: Universal kinetic Short — real MP4/audio smoke

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Original topic (requires a corresponding original_script)
        type: string
        required: false
      original_script:
        description: Two or more original narration paragraphs or sentences
        type: string
        required: false
      language:
        description: Narration language
        type: choice
        options: [en, fr]
        default: en
      voice:
        description: Free neural Kokoro voice (default) or fast eSpeak draft
        type: choice
        options: [kokoro, espeak]
        default: kokoro
      commons_art:
        description: Search Commons for CC0 pictures (online, editorial review required)
        type: boolean
        default: false
      segment_art:
        description: Optional local U2NetP foreground separation for approved CC0 images
        type: boolean
        default: false
  pull_request:
    paths:
      - automate_ytb/universal_kinetic.py
      - automate_ytb/universal_script.py
      - automate_ytb/universal_subject_illustrations.py
      - automate_ytb/universal_subject_interaction.py
      - automate_ytb/universal_scale_camera.py
      - automate_ytb/universal_scale_journey.py
      - automate_ytb/universal_subject_composition.py
      - automate_ytb/universal_subject_motion.py
      - automate_ytb/universal_art25d.py
      - automate_ytb/universal_vector_art.py
      - automate_ytb/universal_actor_rig.py
      - automate_ytb/universal_contact_glints.py
      - automate_ytb/universal_cinematic_portrait.py
      - automate_ytb/universal_caption_overlay.py
      - automate_ytb/universal_joint_hierarchy.py
      - automate_ytb/universal_deformation25d.py
      - automate_ytb/universal_motion25d.py
      - automate_ytb/universal_commons.py
      - automate_ytb/scene25d.py
      - automate_ytb/surface25d.py
      - automate_ytb/master_timeline.py
      - automate_ytb/foley_engine.py
      - automate_ytb/narration.py
      - automate_ytb/universal_voice_evidence.py
      - automate_ytb/shorts_delivery.py
      - tests/test_universal_kinetic.py
      - tests/test_universal_voice_evidence.py
      - tests/test_universal_script.py
      - tests/test_universal_subject_illustrations.py
      - tests/test_universal_chapter_subjects.py
      - tests/test_universal_subject_interaction.py
      - tests/test_universal_scale_camera.py
      - tests/test_universal_scale_journey.py
      - tests/test_universal_subject_composition.py
      - tests/test_universal_subject_motion.py
      - tests/test_universal_art25d.py
      - tests/test_universal_vector_art.py
      - tests/test_universal_actor_rig.py
      - tests/test_universal_cinematic_portrait.py
      - tests/test_universal_caption_overlay.py
      - tests/test_universal_joint_hierarchy.py
      - tests/test_universal_deformation25d.py
      - tests/test_universal_motion25d.py
      - tests/test_universal_commons.py
      - examples/universal_seed_story.en.txt
      - examples/universal_causal_contact_story.en.txt
      - examples/universal_scale_journey_story.en.txt
      - examples/universal_dual_subject_story.en.txt
      - examples/universal_multichapter_story.en.txt
      - examples/universal_planet_story.en.txt
      - examples/universal_web_request.json
      - examples/build_original_actor_rig_sample.py
      - examples/build_original_vector_story.py
      - .github/workflows/universal-kinetic-smoke.yml

permissions:
  contents: read

concurrency:
  group: universal-kinetic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-animation-and-audio:
    name: Original non-science vertical Short
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v espeak-ng >/dev/null; then
            sudo timeout -k 10s 120s apt-get update -qq
            sudo timeout -k 10s 180s apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check -e .
      - name: Cache open neural narration model (requested runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.voice == 'kokoro' && inputs.topic != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-voice-${{ runner.os }}-v1
      - name: Install optional free neural narration (requested runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.voice == 'kokoro' && inputs.topic != ''
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install --disable-pip-version-check -e '.[speech]'
      - name: Install optional local U2NetP foreground inference (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.segment_art
        run: |
          python -m pip install --disable-pip-version-check -e '.[foreground]'
      - name: Validate all story grammars and real video
        run: |
          python -m unittest discover -s tests -p test_universal_kinetic.py -v
          python -m unittest discover -s tests -p test_universal_voice_evidence.py -v
          python -m unittest discover -s tests -p test_universal_script.py -v
          python -m unittest discover -s tests -p test_universal_subject_illustrations.py -v
          python -m unittest discover -s tests -p test_universal_chapter_subjects.py -v
          python -m unittest discover -s tests -p test_universal_subject_interaction.py -v
          python -m unittest discover -s tests -p test_universal_scale_camera.py -v
          python -m unittest discover -s tests -p test_universal_scale_journey.py -v
          python -m unittest discover -s tests -p test_universal_subject_composition.py -v
          python -m unittest discover -s tests -p test_universal_subject_motion.py -v
          python -m unittest discover -s tests -p test_universal_art25d.py -v
          python -m unittest discover -s tests -p test_universal_vector_art.py -v
          python -m unittest discover -s tests -p test_universal_actor_rig.py -v
          python -m unittest discover -s tests -p test_universal_cinematic_portrait.py -v
          python -m unittest discover -s tests -p test_universal_caption_overlay.py -v
          python -m unittest discover -s tests -p test_universal_joint_hierarchy.py -v
          python -m unittest discover -s tests -p test_universal_deformation25d.py -v
          python -m unittest discover -s tests -p test_universal_motion25d.py -v
          python -m unittest discover -s tests -p test_universal_commons.py -v
      - name: Render real original 9:16 topic video
        env:
          YT_TOPIC: ${{ inputs.topic }}
          YT_SCRIPT: ${{ inputs.original_script }}
          YT_LANGUAGE: ${{ inputs.language }}
          YT_VOICE: ${{ inputs.voice }}
          YT_COMMONS_ART: ${{ inputs.commons_art }}
          YT_SEGMENT_ART: ${{ inputs.segment_art }}
        run: |
          mkdir -p build/universal
          COMMONS_ARGS=()
          if [ "${YT_COMMONS_ART:-false}" = "true" ]; then
            COMMONS_ARGS=(--commons-art)
          fi
          if [ "${YT_SEGMENT_ART:-false}" = "true" ]; then
            if [ "${YT_COMMONS_ART:-false}" != "true" ]; then
              echo "::error::Local foreground removal requires commons_art=true" >&2
              exit 2
            fi
            COMMONS_ARGS+=(--segment-art)
          fi
          if [ -n "$YT_TOPIC" ] || [ -n "$YT_SCRIPT" ]; then
            if [ -z "$YT_TOPIC" ] || [ -z "$YT_SCRIPT" ]; then
              echo "::error::Supply BOTH topic and original_script; facts cannot be invented from a title." >&2
              exit 2
            fi
            printf '%s' "$YT_SCRIPT" > build/universal/original-script.txt
            automate-ytb-short --topic "$YT_TOPIC" --script-file build/universal/original-script.txt --language "${YT_LANGUAGE:-en}" --output build/universal/web-request-original.mp4 --voice "${YT_VOICE:-espeak}" --width 720 "${COMMONS_ARGS[@]}"
          else
            automate-ytb-short --brief examples/universal_web_request.json --output build/universal/web-request-original.mp4 --voice espeak --width 720 "${COMMONS_ARGS[@]}"
          fi
      - name: Render another subject from original narration alone
        run: |
          automate-ytb-short --topic "A seed comes to life" --script-file examples/universal_seed_story.en.txt --language en --output build/universal/seed-story-original.mp4 --voice espeak --width 720
      - name: Render a second semantically distinct original subject from only its source text
        run: |
          automate-ytb-short --topic "An illustrated planetary journey" --script-file examples/universal_planet_story.en.txt --language en --output build/universal/planet-story-original.mp4 --voice espeak --width 720
      - name: Verify two different automatically generated original 2.5D subject worlds
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/seed-story-original.mp4 --require-audio --report build/universal/seed-story-delivery-qa.json
          python -m automate_ytb.shorts_delivery --video build/universal/planet-story-original.mp4 --require-audio --report build/universal/planet-story-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('build/universal')
          flora=json.loads((folder/'seed-story-original.json').read_text())
          space=json.loads((folder/'planet-story-original.json').read_text())
          # The source says "seed" in beat one AND "rain" + "leaves"
          # in beat two. V19 correctly composes garden vegetation and rain
          # in that second shot; the former v17 one-family expectation is
          # now obsolete, not a failure of original-world rendering.
          assert flora['proceduralVisualFamily'] is None
          assert flora['proceduralVisualCompositionEngine']=='source-grounded-dual-subject-six-layer-compositor-v1'
          assert flora['proceduralVisualCompositionFamilies']==[
              ['botanical'],['botanical','weather']]
          assert space['proceduralVisualFamily']=='celestial'
          assert space['proceduralVisualCompositionFamilies'] is None
          for report in (flora,space):
              assert report['proceduralMotionEngine']=='grounded-causal-subject-choreography-v2-organic-secondary-sway'
              assert report['proceduralVisualSceneCount']==2
              assert report['proceduralVisualEngine']=='original-source-anchored-procedural-subjects-v1'
              assert report['artwork']['authoredActionActors']==8
              assert report['delivery']['status']=='passed'
              assert report['captionWordsOmitted']==0
              assert not report['publicationApproved']
          assert flora['artwork']['originalVectorLayers']==11
          assert flora['artwork']['flexibleActorParts']==3
          assert len(flora['artwork']['continuousCameraGroups'])==0
          assert space['artwork']['originalVectorLayers']==10
          assert space['artwork']['flexibleActorParts']==0
          assert len(space['artwork']['continuousCameraGroups'])==1
          flora_ids={x['sha256'] for x in flora['artwork']['approvedLayerProvenance']
                     if x.get('vectorId','').endswith('-hero')}
          space_ids={x['sha256'] for x in space['artwork']['approvedLayerProvenance']
                     if x.get('vectorId','').endswith('-hero')}
          assert len(flora_ids)>=2 and len(space_ids)==1
          assert flora_ids.isdisjoint(space_ids)
          print('Two distinct text-driven original subject worlds validated: botanical and celestial, real H264/AAC')
          PY
      - name: Render mixed-topic source-grounded chapter Short
        run: |
          automate-ytb-short --topic "Plants planets and oceans" --script-file examples/universal_multichapter_story.en.txt --language en --output build/universal/multichapter-story-original.mp4 --voice espeak --width 720
      - name: Validate actual 720x1280 multi-chapter MP4 and exact source selection
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/multichapter-story-original.mp4 --require-audio --report build/universal/multichapter-story-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/universal')
          compiled=json.loads((root/'multichapter-story-original.story.json').read_text())
          report=json.loads((root/'multichapter-story-original.json').read_text())
          families=['botanical','celestial','ocean']
          assert compiled['proceduralVisualFamilies']==families
          assert report['proceduralVisualFamilies']==families
          assert report['proceduralVisualFamily'] is None
          assert report['proceduralVisualSceneCount']==3
          assert report['proceduralVisualChapterEngine']=='source-grounded-per-beat-illustration-sequence-v1'
          assert report['proceduralMotionEngine']=='grounded-causal-subject-choreography-v2-organic-secondary-sway'
          assert report['artwork']['originalVectorLayers']==15
          assert report['artwork']['authoredActionActors']==12
          assert report['delivery']['status']=='passed'
          assert report['delivery']['media']['width']==720
          assert report['delivery']['media']['height']==1280
          assert report['captionWordsOmitted']==0
          assert report['publicationApproved'] is False
          seen={x['vectorId'].split('-')[0] for x in report['artwork']['approvedLayerProvenance'] if 'vectorId' in x}
          assert seen==set(families)
          print('Original per-beat illustrated families successfully encoded, narrated and checked')
          PY
      - name: Render genuine original quantitative video using one continuous animated world
        run: |
          automate-ytb-short --topic "What if a glowing thread kept growing?" --script-file examples/universal_scale_journey_story.en.txt --language en --output build/universal/continuous-scale-original.mp4 --voice espeak --width 720
      - name: Verify unbroken source-grounded logarithmic scale stage in actual H264/AAC
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/continuous-scale-original.mp4 --require-audio --report build/universal/continuous-scale-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/universal')
          story=json.loads((root/'continuous-scale-original.story.json').read_text())
          manifest=json.loads((root/'continuous-scale-original.json').read_text())
          points=story['proceduralScaleJourney']['points']
          assert story['proceduralScaleJourneyEngine']=='source-anchored-continuous-log-scale-cinematic-v1'
          assert len(points)==6
          assert [p['sourceSpan'] for p in points]==['1 mm','1 cm','1 m','100 m','1 km','100 km']
          assert [p['metres'] for p in points]==['0.001','0.01','1','100','1000','100000']
          assert manifest['proceduralScaleJourneyEngine']=='source-anchored-continuous-log-scale-cinematic-v1'
          assert manifest['proceduralScaleCameraEngine']=='source-scale-continuous-world-camera-landmarks-v22'
          assert story['proceduralScaleCameraEngine']==manifest['proceduralScaleCameraEngine']
          assert manifest['proceduralScaleLandmarkArtStyle']=='original-illustrative-not-physical-scale'
          assert manifest['proceduralScaleLandmarkCount']==6
          assert manifest['proceduralScaleNumbersSourceVerified'] is True
          assert manifest['voiceEngine']=='espeak'
          assert manifest['delivery']['status']=='passed'
          assert manifest['delivery']['media']['width']==720
          assert manifest['delivery']['media']['height']==1280
          assert manifest['captionWordsOmitted']==0
          assert manifest['publicationApproved'] is False
          assert not manifest['factsReviewed']
          print('Real H.264/AAC 9:16 source-authored continuous scale stage verified')
          PY
      - name: Render two independent concrete subjects in the same original Short
        run: |
          automate-ytb-short --topic "Trees and planets, rain and waves" --script-file examples/universal_dual_subject_story.en.txt --language en --output build/universal/dual-subject-original.mp4 --voice espeak --width 720
      - name: Verify source-grounded dual-object stage in real H264/AAC output
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/dual-subject-original.mp4 --require-audio --report build/universal/dual-subject-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/universal')
          story=json.loads((root/'dual-subject-original.story.json').read_text())
          report=json.loads((root/'dual-subject-original.json').read_text())
          pairs=[['botanical','celestial'],['botanical','celestial'],['weather','ocean']]
          assert story['proceduralVisualCompositionFamilies']==pairs
          assert report['proceduralVisualCompositionFamilies']==pairs
          assert report['proceduralVisualCompositionEngine']=='source-grounded-dual-subject-six-layer-compositor-v1'
          assert report['proceduralVisualSceneCount']==3
          assert report['proceduralVisualFamily'] is None
          assert report['artwork']['originalVectorLayers']==18
          assert report['artwork']['authoredActionActors']==12
          assert len(report['artwork']['continuousCameraGroups'])==1
          assert report['delivery']['status']=='passed'
          assert report['delivery']['media']['width']==720
          assert report['delivery']['media']['height']==1280
          assert report['captionWordsOmitted']==0
          assert report['publicationApproved'] is False
          seen={x['vectorId'] for x in report['artwork']['approvedLayerProvenance'] if x.get('vectorId','').startswith('dual-')}
          assert {'dual-botanical-hero','dual-celestial-hero','dual-weather-hero','dual-ocean-hero'}<=seen
          print('True two-subject original 2.5D scenes encoded and checked without external services')
          PY
      - name: Render a real original source-verb-triggered 2.5D contact Short
        run: |
          automate-ytb-short --topic "Rain waters trees and waves hit trains" --script-file examples/universal_causal_contact_story.en.txt --language en --output build/universal/causal-contact-original.mp4 --voice espeak --width 720
      - name: Verify independently driven actors, persistent cause and exact contact audio
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/causal-contact-original.mp4 --require-audio --report build/universal/causal-contact-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/universal')
          story=json.loads((root/'causal-contact-original.story.json').read_text())
          report=json.loads((root/'causal-contact-original.json').read_text())
          pairs=[['botanical','weather'],['botanical','weather'],['rail','ocean'],['rail','ocean']]
          contacts=[{'kind':'rain-waters-plant','at':.5},None,{'kind':'wave-hits-train','at':.5},None]
          assert story['proceduralVisualCompositionFamilies']==pairs
          assert story['proceduralVisualInteractions']==contacts
          assert report['proceduralVisualInteractionEngine']=='source-verb-anchored-dual-actor-contact-v1'
          assert report['proceduralVisualInteractions']==contacts
          assert report['proceduralCausalContactCount']==2
          assert report['authoredContactCues']==2
          assert report['artwork']['authoredActorLinks']==2
          assert report['artwork']['originalVectorLayers']==24
          assert report['artwork']['authoredActionActors']==16
          assert len(report['artwork']['continuousCameraGroups'])==2
          assert report['delivery']['status']=='passed'
          assert report['delivery']['media']['width']==720
          assert report['delivery']['media']['height']==1280
          assert report['captionWordsOmitted']==0
          assert not report['publicationApproved']
          assert report['sound']=='original-event-locked-foley'
          print('Actual narrated 2.5D contacts, persistent plant state and two PCM cues verified')
          PY
      - name: Render a genuine authored 2.5D actor encounter
        run: |
          python examples/build_original_actor_rig_sample.py --out-dir build/universal/rig
          automate-ytb-short --brief build/universal/rig/actor-rig-story.json --output build/universal/actor-rig-original.mp4 --voice espeak --width 720
      - name: Verify actor actions survive true H.264 + AAC encoding
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/actor-rig-original.mp4 --require-audio --report build/universal/actor-rig-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/universal/actor-rig-original.json').read_text())
          assert report['artwork']['authoredActionActors']==6
          assert report['artwork']['attachedActorParts']==2
          assert report['artwork']['authoredActorLinks']==2
          assert report['authoredContactCues']==2
          assert len(report['artwork']['continuousCameraGroups'])==1
          assert report['delivery']['status']=='passed'
          assert report['voiceEvidence']['status']=='verified-real-audio'
          assert report['voiceEvidence']['engine']=='espeak'
          assert report['voiceEvidence']['naturalnessVerified'] is False
          assert report['captionOverlayEngine']=='pcm-phrase-cinematic-safe-caption-v1'
          assert report['captionWordsOmitted']==0
          assert report['captionLayoutPreflight']=='passed'
          assert not report['wordLevelAligned']
          assert not report['publicationApproved']
          PY
      - name: Render a real original high-detail vector illustration story
        run: |
          python examples/build_original_vector_story.py --out-dir build/universal/vectors
          automate-ytb-short --brief build/universal/vectors/original-vector-story.json --output build/universal/original-vector-story.mp4 --voice espeak --width 720
      - name: Verify generated vector layers and real output media
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/original-vector-story.mp4 --require-audio --report build/universal/original-vector-story-delivery-qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/universal/original-vector-story.json').read_text())
          art=report['artwork']
          assert report['delivery']['status']=='passed'
          assert art['originalVectorLayers']==10
          assert art['originalVectorShapes']>=65
          assert art['attachedActorParts']==6
          assert art['flexibleActorParts']==4
          assert art['deformationEngine']=='bounded-hinge-anchored-rgba-sway-v1'
          assert art['contactVisualEngine']=='localized-causal-glints-without-connector-beams-v1'
          assert art['portraitCompositionEngine']=='edge-matted-full-width-authored-world-v1'
          assert len(art['continuousCameraGroups'])==1
          assert not report['publicationApproved']
          PY
      - name: Independently verify technical delivery
        run: |
          python -m automate_ytb.shorts_delivery \
            --video build/universal/web-request-original.mp4 \
            --require-audio \
            --report build/universal/delivery-qa.json
      - name: Verify second subject real MP4 with voice
        run: |
          python -m automate_ytb.shorts_delivery --video build/universal/seed-story-original.mp4 --require-audio --report build/universal/seed-story-delivery-qa.json
      - name: Measure actual encoded motion and loudness
        run: |
          python scripts/benchmark_audiovisual.py \
            --video build/universal/web-request-original.mp4 \
            --label universal-original-kinetic \
            --video build/universal/seed-story-original.mp4 \
            --label universal-original-nature \
            --video build/universal/actor-rig-original.mp4 \
            --label original-authored-actor-rig \
            --video build/universal/original-vector-story.mp4 \
            --label original-animated-vector-illustration \
            --output build/universal/audiovisual-benchmark.json
      - name: Download verified original media (not private benchmark)
        uses: actions/upload-artifact@v4
        with:
          name: universal-kinetic-original-short
          path: build/universal/
          if-no-files-found: error
          retention-days: 14
