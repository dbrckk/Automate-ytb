name: One-click YouTube preview (free)

on:
  # The same real encoding/voice/QA job is also callable as a release gate.
  # Unlike a fire-and-forget dispatch, the parent job inherits its result.
  workflow_call:
    inputs:
      topic:
        type: string
        required: true
      original_script:
        type: string
        required: true
      character:
        type: string
        required: true
      style:
        type: string
        required: true
      language:
        type: string
        required: true
      voice:
        type: string
        required: true
      voice_style:
        type: string
        required: true
      voice_name:
        type: string
        required: true
      soundtrack:
        type: string
        required: true
      transition:
        type: string
        required: true
      caption_timing:
        type: string
        required: true
      duration_seconds:
        type: number
        required: true
      shot_seconds:
        type: number
        required: true
      resolution:
        type: string
        required: true
      render_profile:
        type: string
        required: true
      cinematic_3d:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      topic:
        description: "Original episode topic"
        type: string
        required: true
        default: "The Purple Owl and the Fireflies"
      original_script:
        description: "Original script: at least one sentence per scene (5 for default 30 sec)"
        type: string
        required: true
        default: "A curious purple owl notices a mysterious light. She follows it through a quiet garden. A glowing firefly dances among the flowers. Together they discover a hidden forest path. At dawn, the owl returns home with a wonderful new story."
      character:
        description: "Your own recurring character (saved in scene prompts)"
        type: string
        required: true
        default: "Original purple owl with round turquoise glasses and a golden scarf"
      style:
        type: choice
        description: "cartoon animals, Earth/ocean science diagrams, or still-card drafts"
        options: [cartoon, science, cinematic, documentary]
        default: cartoon
      language:
        type: choice
        options: [fr, en]
        default: en
      voice:
        type: choice
        description: "Natural Kokoro neural voice (recommended), eSpeak draft, or silent"
        options: [kokoro, espeak, none]
        default: kokoro
      voice_style:
        type: choice
        description: "Speaking pace and energy, independent of speaker"
        options: [natural, gentle, lively, expressive]
        default: expressive
      voice_name:
        type: choice
        description: "Optional Kokoro speaker: auto selects the validated voice for language"
        options: [auto, af_heart, af_bella, af_nicole, af_sarah, am_michael, ff_siwis]
        default: auto
      soundtrack:
        type: choice
        description: "Procedural original background music (no copyrighted samples)"
        options: [ambient, none]
        default: ambient
      transition:
        type: choice
        description: "Adaptive cuts on large scene differences; fades for visually similar frames"
        options: [adaptive, dissolve, cut]
        default: adaptive
      caption_timing:
        type: choice
        description: "audio = speech-synthesized phrase timing, estimated = fast fallback"
        options: [audio, estimated]
        default: audio
      duration_seconds:
        type: number
        default: 30
        description: "Episode target duration before adapting to speech (30-900)"
      shot_seconds:
        type: number
        default: 6
        description: "Average shot length in seconds (3-20)"
      resolution:
        type: choice
        description: "720p or 1080p landscape, shorts = original 1080x1920 science portrait (9:16)"
        options: [720p, 1080p, shorts]
        default: 720p
      render_profile:
        type: choice
        description: "preview = fast 24fps; high = H.264 medium CRF 18, 30fps and AAC 256k (slower CPU render)"
        options: [preview, high]
        default: preview
      cinematic_3d:
        type: boolean
        description: "Legacy disabled: this pipeline now produces 2.5D ONLY"
        default: false

permissions:
  contents: read

# Superseded PR renders should not stall the newest playable preview.
# Main/explicit release renders are never cancelled in flight.
concurrency:
  group: youtube-offline-preview-${{ github.workflow }}-${{ github.ref }}-${{ inputs.style }}-${{ inputs.resolution }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Render original free preview
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open source rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -e .
      - name: Validate shared 2.5D art-direction engine before costly rendering
        run: |
          python -m unittest discover -s tests -p test_shared_extreme25d.py -q
          python -m unittest discover -s tests -p test_shared_surface25d.py -q
      - name: Prepare original script and validate authored science scene actions
        env:
          YT_LEGACY_3D: ${{ inputs.cinematic_3d }}
          YT_SCRIPT: ${{ inputs.original_script }}
          YT_TOPIC: ${{ inputs.topic }}
          YT_CHARACTER: ${{ inputs.character }}
          YT_SECONDS: ${{ inputs.duration_seconds }}
          YT_SHOT: ${{ inputs.shot_seconds }}
          YT_STYLE: ${{ inputs.style }}
          YT_RESOLUTION: ${{ inputs.resolution }}
        run: |
          # Production is strictly original 2.5D. Retain the old typed input
          # only for backward-compatible workflow callers; reject use before
          # Kokoro downloads or Blender installation.
          if [ "$YT_LEGACY_3D" = "true" ]; then
            echo "::error::3D has been retired. Select the 2.5D video pipeline." >&2
            exit 2
          fi
          mkdir -p build
          python - <<'PY'
          import os
          from pathlib import Path
          seconds = int(os.environ["YT_SECONDS"])
          shot = float(os.environ["YT_SHOT"])
          if not 30 <= seconds <= 900 or not 3 <= shot <= 20:
              raise SystemExit("Episode duration must be 30-900 s; shot 3-20 s")
          if round(seconds / shot) > 150:
              raise SystemExit("Maximum 150 scenes per run")
          Path("build/script.txt").write_text(os.environ["YT_SCRIPT"], encoding="utf-8")
          PY
          VISUAL_BRIEF="Original cinematic 3D illustration, rounded character, soft film lighting"
          if [ "$YT_STYLE" = "science" ]; then
            VISUAL_BRIEF="Original schematic animated Earth and ocean science infographic, clear labels and locally generated diagrams; no third-party pictures"
          fi
          python -m automate_ytb.scene_plan \
            --topic "$YT_TOPIC" --script build/script.txt \
            --character "$YT_CHARACTER" --duration "$YT_SECONDS" \
            --style "$VISUAL_BRIEF" \
            --shot-seconds "$YT_SHOT" --output build/scene-plan.json
          python -m automate_ytb.science_preflight \
            --plan build/scene-plan.json --style "$YT_STYLE" \
            --resolution "$YT_RESOLUTION" --output build/scene-preflight.json
      - name: Cache open Kokoro voice assets
        if: ${{ inputs.voice == 'kokoro' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-voice-${{ runner.os }}-v1
      - name: Install optional Kokoro natural speech model runner
        if: ${{ inputs.voice == 'kokoro' }}
        run: |
          # CPU-only PyTorch avoids large CUDA-only libraries on GitHub Actions.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -e '.[speech]'
      - name: Measure true PCM narration and enforce strict pacing BEFORE Blender
        if: ${{ inputs.cinematic_3d && inputs.voice == 'kokoro' && inputs.caption_timing == 'audio' }}
        env:
          YT_LANGUAGE: ${{ inputs.language }}
          YT_VOICE_STYLE: ${{ inputs.voice_style }}
          YT_VOICE_NAME: ${{ inputs.voice_name }}
        run: |
          set -euo pipefail
          VOICE_ARGS=()
          if [ "$YT_VOICE_NAME" != "auto" ]; then
            VOICE_ARGS+=(--voice-name "$YT_VOICE_NAME")
          fi
          python -m automate_ytb.voice_preflight \
            --plan build/scene-plan.json \
            --output-dir build/voice-preflight \
            --language "$YT_LANGUAGE" \
            --voice-style "$YT_VOICE_STYLE" "${VOICE_ARGS[@]}"
          # The file now holds measured speech boundaries; preserve exact
          # original speech in the bundle and do not regenerate it after 3D.
          cp build/voice-preflight/plan.json build/scene-plan.json
          test -s build/voice-preflight/narration.wav
          test -s build/voice-preflight/manifest.json
      - name: Generate authored ocean or aurora scenes with Blender Cycles CPU
        if: ${{ inputs.cinematic_3d }}
        env:
          YT_STYLE: ${{ inputs.style }}
          YT_RESOLUTION: ${{ inputs.resolution }}
        run: |
          if [ "$YT_STYLE" != "science" ] || [ "$YT_RESOLUTION" != "shorts" ]; then
            echo "Blender 3D requires science shorts" >&2
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from automate_ytb.science_storyboards import classify as ocean
          from automate_ytb.science_aurora import (classify as aurora,
                                                    supports_topic as supports_aurora)
          data = json.load(open('build/scene-plan.json', encoding='utf8'))
          topic = data['topic']
          lines = [s['narration'] for s in data['scenes']]
          if supports_aurora(topic) and all(aurora(topic, line) for line in lines):
              domain = 'aurora'
          elif any(ocean(topic, line) for line in lines):
              domain = 'ocean'
          else:
              raise SystemExit('Blender 3D supports only authored ocean-current or aurora science beats')
          Path('build/3d-domain.txt').write_text(domain, encoding='utf8')
          print('VERIFIED_BLENDER_DOMAIN=' + domain)
          PY
          python -m pip install -e '.[motion]'
          sudo apt-get install -y -qq blender
          if [ "$(cat build/3d-domain.txt)" = aurora ]; then
            blender --background --factory-startup -t 2 \
              --python scripts/blender_aurora_stage.py -- \
              --output build/aurora-3d --frames 18 \
              --width 800 --height 1020 --samples 10
            python -m automate_ytb.aurora_stage_review \
              --folder build/aurora-3d --out build/aurora-3d/review.jpg
            python -m automate_ytb.aurora_motion_review \
              --folder build/aurora-3d \
              --out build/aurora-3d/motion-review.json
          else
            blender --background --factory-startup -t 2 \
              --python scripts/blender_ocean_stage.py -- \
              --output build/ocean-3d --frames 10 \
              --width 600 --height 580 --samples 8
            python -m automate_ytb.blender_stage_review \
              --folder build/ocean-3d --out build/ocean-3d/review.jpg
          fi
      - name: Plan scenes, graphics and narration
        env:
          YT_TOPIC: ${{ inputs.topic }}
          YT_CHARACTER: ${{ inputs.character }}
          YT_SECONDS: ${{ inputs.duration_seconds }}
          YT_SHOT: ${{ inputs.shot_seconds }}
          YT_STYLE: ${{ inputs.style }}
          YT_LANGUAGE: ${{ inputs.language }}
          YT_VOICE: ${{ inputs.voice }}
          YT_VOICE_STYLE: ${{ inputs.voice_style }}
          YT_VOICE_NAME: ${{ inputs.voice_name }}
          YT_SOUNDTRACK: ${{ inputs.soundtrack }}
          YT_CAPTION_TIMING: ${{ inputs.caption_timing }}
          YT_TRANSITION: ${{ inputs.transition }}
          YT_RESOLUTION: ${{ inputs.resolution }}
          YT_RENDER_PROFILE: ${{ inputs.render_profile }}
        run: |
          # Only the matching completed 3D manifest activates its renderer.
          # Do not point the ocean cache at a non-existent aurora output.
          if [ -f build/ocean-3d/manifest.json ]; then
            export AUTOMATE_YTB_OCEAN_3D_DIR=build/ocean-3d
          elif [ -f build/aurora-3d/manifest.json ]; then
            export AUTOMATE_YTB_AURORA_3D_DIR=build/aurora-3d
          fi
          VOICE_ARGS=()
          if [ "$YT_VOICE_NAME" != "auto" ]; then
            if [ "$YT_VOICE" != "kokoro" ]; then
              echo "Explicit speaker selection requires voice=kokoro" >&2
              exit 2
            fi
            case "$YT_LANGUAGE:$YT_VOICE_NAME" in
              en:af_heart|en:af_bella|en:af_nicole|en:af_sarah|en:am_michael|fr:ff_siwis)
                VOICE_ARGS=(--voice-name "$YT_VOICE_NAME") ;;
              *)
                echo "Unsupported voice/language combination" >&2
                exit 2 ;;
            esac
          fi
          PREFLIGHT_ARGS=()
          if [ -f build/voice-preflight/manifest.json ]; then
            PREFLIGHT_ARGS=(--voice-preflight build/voice-preflight/manifest.json)
          fi
          # Scene plan and domain semantics were checked before heavy Kokoro downloads.
          # Keep the exact checked plan; no second scene split is allowed.
          python -m automate_ytb.production prepare \
            --plan build/scene-plan.json --output build/image-prompts.jsonl
          python -m automate_ytb.episode \
            --plan build/scene-plan.json --output build/video \
            --style "$YT_STYLE" --language "$YT_LANGUAGE" \
            --voice "$YT_VOICE" --voice-style "$YT_VOICE_STYLE" "${VOICE_ARGS[@]}" \
            --resolution "$YT_RESOLUTION" \
            --soundtrack "$YT_SOUNDTRACK" \
            --caption-timing "$YT_CAPTION_TIMING" \
            --transition "$YT_TRANSITION" \
            --render-profile "$YT_RENDER_PROFILE" "${PREFLIGHT_ARGS[@]}"
      - name: Package Kokoro voice attribution for editorial review
        if: ${{ inputs.voice == 'kokoro' }}
        run: cp docs/VOICE_CREDITS.md build/video/VOICE_CREDITS.md
      - name: Quality gate on real exported video, audio and subtitles
        env:
          EXPECT_VOICE: ${{ inputs.voice }}
          EXPECT_SOUNDTRACK: ${{ inputs.soundtrack }}
          EXPECT_PROFILE: ${{ inputs.render_profile }}
        run: |
          python -m automate_ytb.quality \
            --plan build/scene-plan.json --output build/video \
            --expect-voice "$EXPECT_VOICE" \
            --expect-soundtrack "$EXPECT_SOUNDTRACK" \
            --expect-render-profile "$EXPECT_PROFILE" \
            --report build/video/quality-report.json
      - name: Review technical output and export VTT subtitles
        env:
          EXPECT_AUDIO: ${{ inputs.voice }}
          EXPECT_SOUNDTRACK: ${{ inputs.soundtrack }}
        run: |
          PARAMS=()
          if [ "$EXPECT_AUDIO" != "none" ]; then
            PARAMS+=(--require-audio --target-lufs -16)
          elif [ "$EXPECT_SOUNDTRACK" == "ambient" ]; then
            PARAMS+=(--target-lufs -24)
          fi
          python -m automate_ytb.media_qa --video build/video/preview.mp4 --srt build/video/draft-captions.srt --vtt build/video/draft-captions.vtt --report build/video/media-report.json "${PARAMS[@]}"
      - name: Verify TikTok and YouTube Shorts export from actual MP4
        if: ${{ inputs.resolution == 'shorts' }}
        env:
          EXPECT_VOICE: ${{ inputs.voice }}
          EXPECT_SOUNDTRACK: ${{ inputs.soundtrack }}
        run: |
          AUDIO_ARGS=()
          if [ "$EXPECT_VOICE" != "none" ] || [ "$EXPECT_SOUNDTRACK" != "none" ]; then
            AUDIO_ARGS+=(--require-audio)
          fi
          python -m automate_ytb.shorts_delivery \
            --video build/video/preview.mp4 \
            --report build/video/platform-shorts-report.json "${AUDIO_ARGS[@]}"
      - name: Extract mobile storyboard and check for frozen animated MP4 scenes
        run: |
          python -m automate_ytb.review_board \
            --plan build/scene-plan.json \
            --video build/video/preview.mp4 \
            --output build/video/review \
            --max-samples 12
      - name: Preserve both QA reports and consolidate results
        run: |
          python -m automate_ytb.qa_bundle \
            --structural build/video/quality-report.json \
            --media build/video/media-report.json \
            --visual build/video/review/visual-review.json \
            --story build/video/story-preflight.json \
            --plan build/scene-plan.json \
            --video build/video/preview.mp4 \
            --srt build/video/draft-captions.srt \
            --vtt build/video/draft-captions.vtt \
            --output build/video/qa-summary.json
      - name: Produce actionable professional video review from encoded evidence
        run: |
          python -m automate_ytb.professional_review \
            --summary build/video/qa-summary.json \
            --visual build/video/review/visual-review.json \
            --media build/video/media-report.json \
            --pacing build/video/narration-pacing.json \
            --output build/video/professional-review.json
      - name: Render optional English speaker comparison for listening
        if: ${{ inputs.voice == 'kokoro' && inputs.language == 'en' }}
        continue-on-error: true
        env:
          YT_VOICE_STYLE: ${{ inputs.voice_style }}
        run: |
          python -m automate_ytb.voice_audition \
            --script build/script.txt \
            --output build/video/voice-auditions \
            --style "$YT_VOICE_STYLE"
      - name: Download video, thumbnails, script and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automate-ytb-free-preview
          path: |
            build/scene-plan.json
            build/scene-preflight.json
            build/image-prompts.jsonl
            build/script.txt
            build/video/preview.mp4
            build/video/narration.wav
            build/video/narration-pacing.json
            build/voice-preflight/manifest.json
            build/voice-preflight/plan.json
            build/voice-preflight/narration.wav
            build/voice-preflight/narration-pacing.json
            build/video/voice-sample.mp3
            build/video/voice-auditions/
            build/ocean-3d/manifest.json
            build/ocean-3d/review.jpg
            build/ocean-3d/review.json
            build/aurora-3d/manifest.json
            build/aurora-3d/review.jpg
            build/aurora-3d/review.json
            build/aurora-3d/motion-review.json
            build/aurora-3d/motion-comparison.jpg
            build/video/VOICE_CREDITS.md
            build/video/background-original.wav
            build/video/draft-captions.srt
            build/video/draft-captions.vtt
            build/video/quality-report.json
            build/video/media-report.json
            build/video/qa-summary.json
            build/video/professional-review.json
            build/video/story-preflight.json
            build/video/episode-report.json
            build/video/render-report.json
            build/video/thumbnails/
            build/video/review/
            build/assets/
          retention-days: 7
          if-no-files-found: warn
