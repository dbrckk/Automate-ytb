name: One-click YouTube preview (free)

on:
  # The same real encoding/voice/QA job is also callable as a release gate.
  # Unlike a fire-and-forget dispatch, the parent job inherits its result.
  workflow_call:
    inputs:
      topic:
        type: string
        required: true
      original_script:
        type: string
        required: true
      character:
        type: string
        required: true
      style:
        type: string
        required: true
      language:
        type: string
        required: true
      voice:
        type: string
        required: true
      voice_style:
        type: string
        required: true
      voice_name:
        type: string
        required: true
      soundtrack:
        type: string
        required: true
      transition:
        type: string
        required: true
      caption_timing:
        type: string
        required: true
      duration_seconds:
        type: number
        required: true
      shot_seconds:
        type: number
        required: true
      resolution:
        type: string
        required: true
      render_profile:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      topic:
        description: "Original episode topic"
        type: string
        required: true
        default: "Le voyage de la petite chouette violette"
      original_script:
        description: "Original script: at least one sentence per scene (5 for default 30 sec)"
        type: string
        required: true
        default: "Une petite chouette violette découvre une lumière mystérieuse. Elle se promène doucement dans son jardin. Un papillon lumineux apparaît près des fleurs. Ensemble, ils découvrent un nouveau chemin dans la forêt. Au matin, la chouette revient chez elle avec un grand sourire."
      character:
        description: "Your own recurring character (saved in scene prompts)"
        type: string
        required: true
        default: "Original purple owl with round turquoise glasses and a golden scarf"
      style:
        type: choice
        description: "cartoon animals, Earth/ocean science diagrams, or still-card drafts"
        options: [cartoon, science, cinematic, documentary]
        default: cartoon
      language:
        type: choice
        options: [fr, en]
        default: fr
      voice:
        type: choice
        description: "Natural Kokoro neural voice (recommended), eSpeak draft, or silent"
        options: [kokoro, espeak, none]
        default: kokoro
      voice_style:
        type: choice
        description: "Speaking pace and energy, independent of speaker"
        options: [natural, gentle, lively]
        default: natural
      voice_name:
        type: choice
        description: "Optional Kokoro speaker: auto selects the validated voice for language"
        options: [auto, af_heart, af_bella, am_michael, ff_siwis]
        default: auto
      soundtrack:
        type: choice
        description: "Procedural original background music (no copyrighted samples)"
        options: [ambient, none]
        default: ambient
      transition:
        type: choice
        description: "Visual dissolve without altering narration or subtitle timing"
        options: [dissolve, cut]
        default: dissolve
      caption_timing:
        type: choice
        description: "audio = speech-synthesized phrase timing, estimated = fast fallback"
        options: [audio, estimated]
        default: audio
      duration_seconds:
        type: number
        default: 30
        description: "Episode target duration before adapting to speech (30-900)"
      shot_seconds:
        type: number
        default: 6
        description: "Average shot length in seconds (3-20)"
      resolution:
        type: choice
        description: "720p or 1080p landscape, shorts = original 1080x1920 science portrait (9:16)"
        options: [720p, 1080p, shorts]
        default: 720p
      render_profile:
        type: choice
        description: "preview = fast 24fps; high = H.264 medium CRF 18, 30fps and AAC 256k (slower CPU render)"
        options: [preview, high]
        default: preview

permissions:
  contents: read

# Superseded PR renders should not stall the newest playable preview.
# Main/explicit release renders are never cancelled in flight.
concurrency:
  group: youtube-offline-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Render original free preview
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open source rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -e .
      - name: Cache open Kokoro voice assets
        if: ${{ inputs.voice == 'kokoro' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-voice-${{ runner.os }}-v1
      - name: Install optional Kokoro natural speech model runner
        if: ${{ inputs.voice == 'kokoro' }}
        run: |
          # CPU-only PyTorch avoids large CUDA-only libraries on GitHub Actions.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -e '.[speech]'
      - name: Prepare original script safely
        env:
          YT_SCRIPT: ${{ inputs.original_script }}
          YT_SECONDS: ${{ inputs.duration_seconds }}
          YT_SHOT: ${{ inputs.shot_seconds }}
        run: |
          mkdir -p build
          python - <<'PY'
          import os
          from pathlib import Path
          seconds = int(os.environ["YT_SECONDS"])
          shot = float(os.environ["YT_SHOT"])
          if not 30 <= seconds <= 900 or not 3 <= shot <= 20:
              raise SystemExit("Episode duration must be 30-900 s; shot 3-20 s")
          if round(seconds / shot) > 150:
              raise SystemExit("Maximum 150 scenes per run")
          Path("build/script.txt").write_text(os.environ["YT_SCRIPT"], encoding="utf-8")
          PY
      - name: Plan scenes, graphics and narration
        env:
          YT_TOPIC: ${{ inputs.topic }}
          YT_CHARACTER: ${{ inputs.character }}
          YT_SECONDS: ${{ inputs.duration_seconds }}
          YT_SHOT: ${{ inputs.shot_seconds }}
          YT_STYLE: ${{ inputs.style }}
          YT_LANGUAGE: ${{ inputs.language }}
          YT_VOICE: ${{ inputs.voice }}
          YT_VOICE_STYLE: ${{ inputs.voice_style }}
          YT_VOICE_NAME: ${{ inputs.voice_name }}
          YT_SOUNDTRACK: ${{ inputs.soundtrack }}
          YT_CAPTION_TIMING: ${{ inputs.caption_timing }}
          YT_TRANSITION: ${{ inputs.transition }}
          YT_RESOLUTION: ${{ inputs.resolution }}
          YT_RENDER_PROFILE: ${{ inputs.render_profile }}
        run: |
          VISUAL_BRIEF="Original cinematic 3D illustration, rounded character, soft film lighting"
          if [ "$YT_STYLE" = "science" ]; then
            VISUAL_BRIEF="Original schematic animated Earth and ocean science infographic, clear labels and locally generated diagrams; no third-party pictures"
          fi
          VOICE_ARGS=()
          if [ "$YT_VOICE_NAME" != "auto" ]; then
            if [ "$YT_VOICE" != "kokoro" ]; then
              echo "Explicit speaker selection requires voice=kokoro" >&2
              exit 2
            fi
            case "$YT_LANGUAGE:$YT_VOICE_NAME" in
              en:af_heart|en:af_bella|en:am_michael|fr:ff_siwis)
                VOICE_ARGS=(--voice-name "$YT_VOICE_NAME") ;;
              *)
                echo "Unsupported voice/language combination" >&2
                exit 2 ;;
            esac
          fi
          python -m automate_ytb.scene_plan \
            --topic "$YT_TOPIC" --script build/script.txt \
            --character "$YT_CHARACTER" --duration "$YT_SECONDS" \
            --style "$VISUAL_BRIEF" \
            --shot-seconds "$YT_SHOT" --output build/scene-plan.json
          python -m automate_ytb.production prepare \
            --plan build/scene-plan.json --output build/image-prompts.jsonl
          python -m automate_ytb.episode \
            --plan build/scene-plan.json --output build/video \
            --style "$YT_STYLE" --language "$YT_LANGUAGE" \
            --voice "$YT_VOICE" --voice-style "$YT_VOICE_STYLE" "${VOICE_ARGS[@]}" \
            --resolution "$YT_RESOLUTION" \
            --soundtrack "$YT_SOUNDTRACK" \
            --caption-timing "$YT_CAPTION_TIMING" \
            --transition "$YT_TRANSITION" \
            --render-profile "$YT_RENDER_PROFILE"
      - name: Package Kokoro voice attribution for editorial review
        if: ${{ inputs.voice == 'kokoro' }}
        run: cp docs/VOICE_CREDITS.md build/video/VOICE_CREDITS.md
      - name: Quality gate on real exported video, audio and subtitles
        env:
          EXPECT_VOICE: ${{ inputs.voice }}
          EXPECT_SOUNDTRACK: ${{ inputs.soundtrack }}
          EXPECT_PROFILE: ${{ inputs.render_profile }}
        run: |
          python -m automate_ytb.quality \
            --plan build/scene-plan.json --output build/video \
            --expect-voice "$EXPECT_VOICE" \
            --expect-soundtrack "$EXPECT_SOUNDTRACK" \
            --expect-render-profile "$EXPECT_PROFILE" \
            --report build/video/quality-report.json
      - name: Review technical output and export VTT subtitles
        env:
          EXPECT_AUDIO: ${{ inputs.voice }}
          EXPECT_SOUNDTRACK: ${{ inputs.soundtrack }}
        run: |
          PARAMS=()
          if [ "$EXPECT_AUDIO" != "none" ]; then
            PARAMS+=(--require-audio --target-lufs -16)
          elif [ "$EXPECT_SOUNDTRACK" == "ambient" ]; then
            PARAMS+=(--target-lufs -24)
          fi
          python -m automate_ytb.media_qa --video build/video/preview.mp4 --srt build/video/draft-captions.srt --vtt build/video/draft-captions.vtt --report build/video/media-report.json "${PARAMS[@]}"
      - name: Extract mobile storyboard and check for frozen animated MP4 scenes
        run: |
          python -m automate_ytb.review_board \
            --plan build/scene-plan.json \
            --video build/video/preview.mp4 \
            --output build/video/review \
            --max-samples 12
      - name: Preserve both QA reports and consolidate results
        run: |
          python -m automate_ytb.qa_bundle \
            --structural build/video/quality-report.json \
            --media build/video/media-report.json \
            --visual build/video/review/visual-review.json \
            --story build/video/story-preflight.json \
            --plan build/scene-plan.json \
            --video build/video/preview.mp4 \
            --srt build/video/draft-captions.srt \
            --vtt build/video/draft-captions.vtt \
            --output build/video/qa-summary.json
      - name: Download video, thumbnails, script and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automate-ytb-free-preview
          path: |
            build/scene-plan.json
            build/image-prompts.jsonl
            build/script.txt
            build/video/preview.mp4
            build/video/narration.wav
            build/video/narration-pacing.json
            build/video/voice-sample.mp3
            build/video/VOICE_CREDITS.md
            build/video/background-original.wav
            build/video/draft-captions.srt
            build/video/draft-captions.vtt
            build/video/quality-report.json
            build/video/media-report.json
            build/video/qa-summary.json
            build/video/story-preflight.json
            build/video/episode-report.json
            build/video/render-report.json
            build/video/thumbnails/
            build/video/review/
            build/assets/
          retention-days: 7
          if-no-files-found: warn
