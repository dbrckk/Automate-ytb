name: Verify universal original 2.5D scene and material quality contracts

on:
  pull_request:
    paths:
      - ".github/workflows/universal-25d-quality.yml"
      - "automate_ytb/visual_quality25d.py"
      - "automate_ytb/scene25d.py"
      - "automate_ytb/surface25d.py"
      - "automate_ytb/lightfield25d.py"
      - "automate_ytb/event_lighting25d.py"
      - "automate_ytb/finish25d.py"
      - "tests/test_lightfield25d.py"
      - "tests/test_event_lighting25d.py"
      - "tests/test_finish25d_seamless.py"
      - "tests/test_visual_quality25d.py"
      - "tests/test_scene25d.py"
      - "tests/test_shared_surface25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/universal-25d-quality.yml"
      - "automate_ytb/visual_quality25d.py"
      - "automate_ytb/scene25d.py"
      - "automate_ytb/surface25d.py"
      - "automate_ytb/lightfield25d.py"
      - "automate_ytb/event_lighting25d.py"
      - "automate_ytb/finish25d.py"
      - "tests/test_lightfield25d.py"
      - "tests/test_event_lighting25d.py"
      - "tests/test_finish25d_seamless.py"
      - "tests/test_visual_quality25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-2p5d-art-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free deterministic image compositor dependency
        run: python -m pip install Pillow
      - name: Compile shared material, depth and quality engines
        run: python -m py_compile automate_ytb/visual_quality25d.py automate_ytb/scene25d.py automate_ytb/surface25d.py automate_ytb/lightfield25d.py automate_ytb/event_lighting25d.py automate_ytb/finish25d.py
      - name: Verify generic layers, depth, masks and authored material signal
        run: |
          python -m unittest discover -s tests -p test_visual_quality25d.py -v
          python -m unittest discover -s tests -p test_scene25d.py -v
          python -m unittest discover -s tests -p test_shared_surface25d.py -v
          python -m unittest discover -s tests -p test_lightfield25d.py -v
          python -m unittest discover -s tests -p test_event_lighting25d.py -v
          python -m unittest discover -s tests -p test_finish25d_seamless.py -v
