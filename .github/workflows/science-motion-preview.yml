name: Preview actual original science motion (free CPU)

on:
  push:
    branches:
      - "feat/solar-storm-animated-science-sequences-20261031"
      - main
    paths:
      - "production/solar_storm/science_vfx.py"
      - "production/solar_storm/preview_science_vfx.py"
      - "tests/test_solar_storm_science_vfx.py"
      - ".github/workflows/science-motion-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-original-science-motion:
    name: Encode five real moving H264 scientific scenes with FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free CPU renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Verify actual animated pixels, authored source role and H264
        run: python -m unittest discover -s tests -p test_solar_storm_science_vfx.py -v
      - name: Render five independently animated science shots and final review MP4
        run: python production/solar_storm/preview_science_vfx.py
      - name: Preserve playable MP4 and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: original-solar-science-motion-preview
          path: |
            production/solar_storm/out/science_motion_review/Original_Science_Motion_Review_1080x1920.mp4
            production/solar_storm/out/science_motion_review/science_motion_contact_sheet.jpg
            production/solar_storm/out/science_motion_review/visual_qa.json
          if-no-files-found: error
          retention-days: 14
