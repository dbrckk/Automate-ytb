name: Verify original 2.5D irregular lava banks and water flow motion

on:
  pull_request:
    paths:
      - ".github/workflows/flow-banks-25d-review.yml"
      - "automate_ytb/flow_banks25d.py"
      - "automate_ytb/science_volcano.py"
      - "automate_ytb/science_storyboards.py"
      - "tests/test_flow_banks25d.py"
      - "scripts/review_flow_banks25d.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flow-banks-25d-review.yml"
      - "automate_ytb/flow_banks25d.py"
      - "automate_ytb/science_volcano.py"
      - "automate_ytb/science_storyboards.py"
      - "tests/test_flow_banks25d.py"
      - "scripts/review_flow_banks25d.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free original source-space painter
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test physical shoreline geometry, motion and real story regressions
        run: |
          set -euo pipefail
          python -m py_compile automate_ytb/flow_banks25d.py automate_ytb/science_volcano.py automate_ytb/science_storyboards.py scripts/review_flow_banks25d.py
          python -m unittest discover -s tests -p test_flow_banks25d.py -v
          python -m unittest discover -s tests -p test_material_ribbons25d.py -v
          python -m unittest discover -s tests -p test_science_volcano.py -v
          python -m unittest discover -s tests -p test_science_storyboards.py -v
          python -m unittest discover -s tests -p test_fluid_emitter25d.py -v
      - name: Render original 1080x1920 magma and water timeline evidence
        run: |
          set -euo pipefail
          python scripts/review_flow_banks25d.py --out build/p522-flow
          test -s build/p522-flow/original-lava-water-banks-25d.jpg
          test -s build/p522-flow/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-p522-physical-flow-banks-25d
          path: build/p522-flow/
          retention-days: 14
          if-no-files-found: error
