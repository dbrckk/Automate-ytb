name: Verify narrated 2.5D forest short with real Kokoro PCM

on:
  # A vetted main-branch export is the source for an automatic, permanent
  # GitHub Release download. Pull-request renders are never auto-published.
  push:
    branches: [main]
    paths:
      - "automate_ytb/forest25d.py"
      - "automate_ytb/forest_soundscape25d.py"
      - "automate_ytb/forest_editorial_lens25d.py"
      - "automate_ytb/forest_voice_timeline.py"
      - "automate_ytb/forest_cinematic_world25d.py"
      - "automate_ytb/forest_cinematic_framing25d.py"
      - "automate_ytb/forest_reactive_meadow25d.py"
      - "automate_ytb/forest_canopy_wind25d.py"
      - "automate_ytb/forest_character_art25d.py"
      - "automate_ytb/forest_head_sculpt25d.py"
      - "automate_ytb/forest_organic_mesh25d.py"
      - "automate_ytb/forest_anatomical_limb25d.py"
      - "automate_ytb/forest_contact25d.py"
      - "automate_ytb/forest_butterfly25d.py"
      - "automate_ytb/forest_captions25d.py"
      - "scripts/render_25d_narrated_story.py"
      - "scripts/verify_release_video.py"
      - ".github/workflows/p3-5-narrated-forest.yml"
  pull_request:
    paths:
      - "automate_ytb/forest_voice_timeline.py"
      - "automate_ytb/forest_soundscape25d.py"
      - "automate_ytb/forest_editorial_lens25d.py"
      - "tests/test_forest_soundscape25d.py"
      - "tests/test_forest_editorial_lens25d.py"
      - "automate_ytb/forest25d.py"
      - "automate_ytb/forest_character_art25d.py"
      - "automate_ytb/forest_head_sculpt25d.py"
      - "automate_ytb/forest_contact25d.py"
      - "automate_ytb/forest_butterfly25d.py"
      - "tests/test_forest_butterfly25d.py"
      - "tests/test_forest_contact25d.py"
      - "automate_ytb/forest_organic_mesh25d.py"
      - "automate_ytb/forest_anatomical_limb25d.py"
      - "tests/test_forest_character_art25d.py"
      - "tests/test_forest_head_sculpt25d.py"
      - "tests/test_forest_organic_mesh25d.py"
      - "tests/test_forest_anatomical_limb25d.py"
      - "automate_ytb/forest_cinematic_world25d.py"
      - "automate_ytb/forest_canopy_wind25d.py"
      - "automate_ytb/forest_cinematic_framing25d.py"
      - "automate_ytb/forest_reactive_meadow25d.py"
      - "tests/test_forest_cinematic_framing25d.py"
      - "tests/test_forest_reactive_meadow25d.py"
      - "tests/test_forest_cinematic_world25d.py"
      - "tests/test_forest_canopy_wind25d.py"
      - "automate_ytb/forest_captions25d.py"
      - "scripts/render_25d_narrated_story.py"
      - "tests/test_forest_voice_timeline.py"
      - "tests/test_forest_captions25d.py"
      - ".github/workflows/p3-5-narrated-forest.yml"
  workflow_dispatch:

permissions:
  contents: write  # required to publish permanent GitHub Release assets on main

jobs:
  narrated-forest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real open-source neural voice and FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout -k 10s 180s apt-get update -qq
            sudo timeout -k 10s 180s apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check -e '.[speech]'
      - name: Validate physical narration timing and rejection of fabricated PCM
        run: |
          python -m unittest discover -s tests -p test_forest_voice_timeline.py -v
          python -m unittest discover -s tests -p test_forest_soundscape25d.py -v
          python -m unittest discover -s tests -p test_forest_editorial_lens25d.py -v
          python -m unittest discover -s tests -p test_forest_captions25d.py -v
          python -m unittest discover -s tests -p test_forest_cinematic_world25d.py -v
          python -m unittest discover -s tests -p test_forest_canopy_wind25d.py -v
          python -m unittest discover -s tests -p test_forest_cinematic_framing25d.py -v
          python -m unittest discover -s tests -p test_forest_reactive_meadow25d.py -v
          python -m unittest discover -s tests -p test_forest_character_art25d.py -v
          python -m unittest discover -s tests -p test_forest_head_sculpt25d.py -v
          python -m unittest discover -s tests -p test_forest_contact25d.py -v
          python -m unittest discover -s tests -p test_forest_butterfly25d.py -v
          python -m unittest discover -s tests -p test_forest_organic_mesh25d.py -v
          python -m unittest discover -s tests -p test_forest_anatomical_limb25d.py -v
      - name: Render actual Kokoro English narrated Short (fox)
        run: |
          python scripts/render_25d_narrated_story.py --language en --animal fox --output out/p35/forest-narrated-en.mp4
      - name: Validate decoded video and real voice manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/p35/forest-narrated-en.json")
          qa=json.loads(p.read_text())
          assert qa["voiceEngine"]=="kokoro-natural"
          assert qa["soundscape"]["version"].startswith("forest-original-voice-ducked-causal-soundscape-p47")
          assert qa["soundscape"]["originalLocallySynthesized"] is True
          assert qa["soundscape"]["causalIKEvents"] is True
          assert qa["soundscape"]["speechDucking"] is True
          assert qa["soundscape"]["clippedSamples"]==0
          assert qa["soundscape"]["footstepCount"]>=8
          assert qa["soundscape"]["contactVideoSeconds"] < qa["soundscape"]["butterflyVideoSeconds"]
          assert qa["cinematicLens"].startswith("forest-25d-measured-cut-rack-focus-p47")
          assert qa["captions"].startswith("actual-PCM-timed")
          assert qa["captionPresentation"].startswith("forest-mobile-kinetic-compact-captions-p40")
          assert qa["cinematicFraming"].startswith("forest-25d-mobile-hero-camera-p44")
          assert qa["livingMeadow"]["version"].startswith("forest-25d-causal-living-meadow-p45")
          assert qa["livingMeadow"]["worldSpaceRootedPlants"]>=60
          assert qa["livingMeadow"]["causalPawWave"] is True
          assert qa["livingCanopy"]["version"].startswith("forest-25d-rooted-mesh-canopy-wind-p46")
          assert qa["livingCanopy"]["deformedLayers"]==["trees","understory"] or qa["livingCanopy"]["deformedLayers"]==["understory","trees"]
          assert qa["livingCanopy"]["rootLocked"] is True
          assert qa["livingCanopy"]["perFrameMeshResampling"] is True
          assert qa["artDirection"].startswith("original-forest-cinematic")
          assert qa["editorialTitles"] is False
          assert qa["characterMaterials"].startswith("original-p37")
          assert qa["organicSoftBody"].startswith("original-p38")
          assert qa["anatomicalLimbs"].startswith("original-p39")
          assert qa["headSculpt"].startswith("original-p43")
          assert qa["groundedFlower"].startswith("25d-world-paw-grounded-spring-flower-face-clear-p43")
          assert qa["causalButterfly"].startswith("forest-25d-causal-clear-silhouette-butterfly-p42")
          assert qa["language"]=="en"
          assert qa["durationSeconds"]>=8
          assert len(qa["beats"])==4
          assert qa["publicationApproved"] is False
          assert Path("out/p35/forest-narrated-en.mp4").stat().st_size>100000
          print(json.dumps(qa,indent=2))
          PY
      - name: Publish durable HTTPS MP4 download (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VIDEO="out/p35/forest-narrated-en.mp4"
          REPORT="out/p35/forest-narrated-en.json"
          TAG="short-${GITHUB_SHA:0:12}"
          python scripts/verify_release_video.py "$VIDEO" "$REPORT"
          sha256sum "$VIDEO" "$REPORT" > out/p35/SHA256SUMS.txt
          gh release create "$TAG" "$VIDEO#forest-narrated-en.mp4" "$REPORT#forest-narrated-en.json" "out/p35/SHA256SUMS.txt#SHA256SUMS.txt" \
            --title "Automate-ytb validated Short ${GITHUB_SHA:0:12}" \
            --notes "Validated real Kokoro EN 2.5D forest Short. Public QA preview, NOT approved for social-platform publication. Permanent HTTPS MP4 and SHA-256 checksum. Built from commit ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" --latest=false
          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/forest-narrated-en.mp4"
          # Do not claim delivery if the public link fails. Github release
          # propagation can take a few seconds; bounded retries are deliberate.
          for i in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --range 0-1023 \
                --max-time 30 --output /tmp/release-check.mp4 "$URL"; then
              test -s /tmp/release-check.mp4
              echo "VERIFIED_PERMANENT_VIDEO_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Permanent GitHub Release MP4 URL not reachable"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: p35-real-kokoro-narrated-forest-en
          path: |
            out/p35/forest-narrated-en.mp4
            out/p35/forest-narrated-en.json
          retention-days: 7
          if-no-files-found: error
