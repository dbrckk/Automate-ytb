name: Render real Kokoro narration for original ocean Short

on:
  pull_request:
    paths:
      - ".github/workflows/kokoro-short-voice.yml"
      - "automate_ytb/short_voice.py"
      - "automate_ytb/deepsea_short.py"
      - "automate_ytb/short_captions.py"
      - "automate_ytb/speech_pcm.py"
      - "tests/test_short_captions.py"
      - "automate_ytb/subject_reframe.py"
      - "automate_ytb/soundtrack.py"
      - "automate_ytb/media_qa.py"
      - "tests/test_subject_reframe.py"
      - "examples/deep-ocean-jellyfish-short.en.txt"
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR commit must not keep rendering the same 1080p NOAA
# documentary and downloading the same model/footage repeatedly.
concurrency:
  group: kokoro-documentary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache public natural-voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-voice-${{ runner.os }}-v1
      - name: Install free open-source neural speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          ffmpeg -hide_banner -filters 2>&1 | grep -E '[[:space:]]ass[[:space:]]' > /dev/null
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install -e '.[speech]'
      - name: Generate original English narrator and beat timings
        run: |
          python -m automate_ytb.short_voice \
            --script examples/deep-ocean-jellyfish-short.en.txt \
            --output build/shorts-narrator/narration.wav \
            --language en --voice af_heart --style natural
      - name: Inspect synthesized WAV content, non-silence and timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import wave
          root = Path("build/shorts-narrator")
          report = json.loads((root/"narration.json").read_text(encoding="utf8"))
          with wave.open(str(root/"narration.wav"), "rb") as wav:
              assert wav.getframerate() == 24000
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2
              pcm = np.frombuffer(wav.readframes(wav.getnframes()),dtype="<i2")
          assert len(pcm)>24000*8
          assert float(np.sqrt(np.mean((pcm.astype("float64")/32768)**2))) > .004
          assert len(report["beats"]) == 4
          assert all(0<=x["startMs"]<x["endMs"] for x in report["beats"])
          assert report["engine"] == "kokoro-natural"
          assert report["captionCount"] >= 7
          assert report["wordLevelAligned"] is False
          assert all(len(b["captionSegments"]) >= 1 for b in report["beats"])
          from automate_ytb.short_captions import verify_measured_beats
          cues=verify_measured_beats(
              report["beats"],duration_ms=round(report["durationSeconds"]*1000))
          assert len(cues)==report["captionCount"]
          print("Verified true neural voice, non-silent PCM and actual beat timecodes")
          PY
      - name: Acquire attributed real-world jellyfish footage for the final edit
        run: |
          mkdir -p build/shorts-footage
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --user-agent 'Automate-ytb-educational-video/1.0 (source NOAA via Wikimedia Commons)' \
            'https://upload.wikimedia.org/wikipedia/commons/9/9f/Okeanos_Explorer_PR_and_USVI_Dive_8-_Psychedelic_Medusa-NOAA-1280x720.webm' \
            -o build/shorts-footage/noaa-medusa-public-domain.webm
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --user-agent 'Automate-ytb-educational-video/1.0 (source Wikimedia Commons)' \
            'https://upload.wikimedia.org/wikipedia/commons/c/c1/Jellyfish-_2016_Deepwater_Exploration_of_the_Marianas.webm' \
            -o build/shorts-footage/noaa-crossota-public-domain.webm
          ffprobe -v error -show_entries stream=codec_type,width,height -of json \
            build/shorts-footage/noaa-medusa-public-domain.webm
          ffprobe -v error -show_entries stream=codec_type,width,height -of json \
            build/shorts-footage/noaa-crossota-public-domain.webm
      - name: Produce final vertical 30 FPS documentary with measured Kokoro scene beats
        run: |
          python -m automate_ytb.deepsea_short \
            --crossota build/shorts-footage/noaa-crossota-public-domain.webm \
            --medusa build/shorts-footage/noaa-medusa-public-domain.webm \
            --voice build/shorts-narrator/narration.wav \
            --report build/shorts-narrator/narration.json \
            --output build/shorts-narrator/deep-sea-short.mp4
      - name: Verify subject-guided camera track and no static title cards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("build/shorts-narrator/deep-sea-short.json").read_text())
          shots=report["portraitTracking"]
          assert len(shots)==4
          assert report["staticTitleCards"] is False
          assert report["opticalSubjectDetection"] is False
          for shot in shots:
              assert shot["sampledFrames"] >= 2
              assert shot["requiresVisualReview"] is True
              frames=shot["keyframes"]
              assert len(frames) >= 2
              ceiling=shot["sourceWidth"]-shot["cropWidth"]
              assert all(0 <= frame["cropX"] <= ceiling and
                         frame["cropX"] % 2 == 0 for frame in frames)
              assert all(a["timeSeconds"] < b["timeSeconds"]
                         for a,b in zip(frames,frames[1:]))
          print("Real decoded source frames guided all four portrait camera paths")
          PY
      - name: Independently verify real H264 MP4 audio and subtitle timing
        run: |
          EXPECTED_DURATION=$(python -c "import json; print(json.load(open('build/shorts-narrator/narration.json'))['durationSeconds'])")
          python -m automate_ytb.media_qa \
            --video build/shorts-narrator/deep-sea-short.mp4 \
            --srt build/shorts-narrator/deep-sea-short.srt \
            --duration "$EXPECTED_DURATION" --require-audio --target-lufs -16 \
            --report build/shorts-narrator/deep-sea-media-qa.json
          python -m automate_ytb.shorts_delivery \
            --video build/shorts-narrator/deep-sea-short.mp4 \
            --require-audio \
            --report build/shorts-narrator/platform-shorts-report.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          media=json.loads((Path("build/shorts-narrator/deep-sea-short.json")).read_text())
          assert media["voiceEngine"]=="kokoro-natural"
          assert media["resolution"]==[1080,1920]
          assert not media["publicationApproved"]
          assert media["burnedInCaptions"] is True
          assert media["wordLevelAligned"] is False
          assert media["captionCount"] >= 7
          assert media["captionTimingMethod"] == "individual-Kokoro-PCM-phrase-samples"
          raw=subprocess.check_output([
              "ffprobe","-v","error","-show_entries",
              "stream=codec_type,codec_name,width,height,avg_frame_rate",
              "-of","json","build/shorts-narrator/deep-sea-short.mp4"
          ])
          streams=json.loads(raw)["streams"]
          vids=[s for s in streams if s["codec_type"]=="video"]
          audio=[s for s in streams if s["codec_type"]=="audio"]
          assert len(vids)==1 and len(audio)==1
          assert vids[0]["codec_name"]=="h264" and vids[0]["width"]==1080 and vids[0]["height"]==1920
          from fractions import Fraction
          actual_fps=float(Fraction(vids[0]["avg_frame_rate"]))
          assert abs(actual_fps-30) < 0.1 and audio[0]["codec_name"]=="aac"
          print("Real fully narrated NOAA jellyfish MP4 passed 9:16 30 FPS H264 AAC checks")
          PY
      - name: Upload complete narrated Short, rights, subtitles and QC
        uses: actions/upload-artifact@v4
        with:
          name: original-deep-sea-kokoro-narration
          path: |
            build/shorts-narrator/narration.wav
            build/shorts-narrator/narration.json
            build/shorts-narrator/deep-sea-short.mp4
            build/shorts-narrator/deep-sea-short.srt
            build/shorts-narrator/deep-sea-short.json
            build/shorts-narrator/deep-sea-media-qa.json
            build/shorts-narrator/platform-shorts-report.json
            examples/deep-ocean-jellyfish-short.en.txt
            docs/VOICE_CREDITS.md
            build/shorts-footage/*.webm
            docs/DEEP_OCEAN_FOOTAGE_CREDITS.md
          retention-days: 7
          if-no-files-found: error
